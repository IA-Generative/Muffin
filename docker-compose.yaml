services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Host 8081, not 8080: Keycloak already claims host 8080 below.
      - "8081:8080"
    restart: unless-stopped

  # One-shot: runs Alembic migrations to head, then exits. The backend (and
  # every worker that talks to it) depends on this completing successfully,
  # so a fresh `docker compose down -v && up` never starts the app against an
  # empty DB (which crashes on the first query, e.g. app_settings).
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://muffin:muffin@postgres:5432/muffin
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://muffin:muffin@postgres:5432/muffin
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: muffin
      KEYCLOAK_CLIENT_ID: muffin-backend
      KEYCLOAK_CLIENT_SECRET: dev-only-secret-not-for-prod
      # Public URL the browser uses to reach the backend. Used to build the
      # fixed OAuth2 redirect_uri registered in Keycloak
      # ({BACKEND_PUBLIC_URL}/api/auth/callback). Override in .env when the
      # backend is exposed through a different host/port (reverse-proxy, etc.).
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      # :8081 by default (the dockerized frontend service below). Override to
      # http://localhost:5173 in a local .env when running `make front`
      # instead - the redirect after login and CORS both key off this single
      # origin, so it must match whichever frontend you're actually using.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      SESSION_COOKIE_SECURE: "false"
      # LLM hub (OpenAI-compatible). Unset in .env by default -
      # GET /api/models responds 503 instead of crashing the app.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      # Shared secret checked on every /api/internal/* call from a worker.
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-only-worker-key-not-for-prod}
      # HMAC pepper for pending collection-share invitations (see app/core/sharing.py). Unset in
      # a real deployment and POST /api/collections/{id}/shares responds 503 instead of hashing
      # without one.
      SHARE_INVITE_PEPPER: ${SHARE_INVITE_PEPPER:-dev-only-pepper-not-for-prod}
      # Without these, RustFsSettings falls back to its localhost:9000
      # default, which inside this container resolves to nothing - file
      # uploads fail silently before a Document row is even created.
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_BUCKET: muffin-documents
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-only-qdrant-key-not-for-prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # worker/document_process runs as three services from the same image (#291), one per kind of
  # work - see app/celery_app.py there for which task goes where.
  # Extraction: OCR, parsing, fetching a URL - CPU-bound, prefork. The image's default command
  # (Dockerfile): its queue, the one before #291 drained for a release, and the beat.
  worker-document-process:
    build:
      context: ./worker/document_process
      dockerfile: Dockerfile
    environment: &document-process-env
      # The scanned pages are read by the OCR pods below (#403), with Tesseract as the fallback of a page they cannot
      # read. Shared by the three services of this image through this anchor, which they must: the chunking and the
      # summary run in the enrichment one and fingerprint the extraction they follow (app/reuse.py).
      OCR_ENGINE: layout
      # The tables are read as tables by the worker-ocr-table service (#410), not as text. Same in the three services.
      OCR_READ_TABLES_AS_TEXT: "false"
      # The images and tables are described by the worker-ocr-vision service (#411) when a collection chose the local engine.
      VISION_POD_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      BACKEND_API_URL: http://backend:8000
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-only-worker-key-not-for-prod}
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_BUCKET: muffin-documents
    depends_on: &document-process-depends-on
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  # Enrichment: chunking with its embeddings, summary, QA, entities, tags - mostly waiting for the
  # embeddings/LLM API, so a pool of threads runs many at once. No beat here.
  worker-document-enrichment:
    build:
      context: ./worker/document_process
      dockerfile: Dockerfile
    environment: *document-process-env
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "-Q", "document_enrichment", "-P", "threads", "-c", "16"]
    depends_on: *document-process-depends-on
    restart: unless-stopped

  # Long I/O jobs: the blue/green index rebuilds (#12) and the ZIP imports (#223), so that neither
  # holds up the ingestion of new documents. A ZIP import's documents then go through extraction
  # like any other, after them. No beat here.
  worker-index-rebuild:
    build:
      context: ./worker/document_process
      dockerfile: Dockerfile
    environment: *document-process-env
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "-Q", "index_rebuild,document_import", "-c", "2"]
    depends_on: *document-process-depends-on
    restart: unless-stopped

  # The OCR pods of the scanned pages (#403): one service, one image per model, started with the rest since the
  # extraction worker sends them the scanned pages (OCR_ENGINE: layout above). To go without them, and read the
  # scanned pages with Tesseract only, set OCR_ENGINE: tesseract above and stop these two services.
  # Each loads its model once per process (about 1 GB): -c is how many pages it reads at once.
  worker-ocr-layout:
    build:
      context: ./worker/layout
      dockerfile: Dockerfile
    environment: &ocr-pod-env
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_BUCKET: muffin-documents
    depends_on: &ocr-pod-depends-on
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  worker-ocr:
    build:
      context: ./worker/ocr
      dockerfile: Dockerfile
    environment: *ocr-pod-env
    depends_on: *ocr-pod-depends-on
    restart: unless-stopped

  # The tables of the scanned pages (#410): their structure (SLANet_plus) and the text of their cells.
  worker-ocr-table:
    build:
      context: ./worker/table
      dockerfile: Dockerfile
    environment: *ocr-pod-env
    depends_on: *ocr-pod-depends-on
    restart: unless-stopped

  # The descriptions of the images and tables of the scanned pages (#411): Florence-2 base. CPU inference is the slowest
  # step of the chain and the model weighs about 2 GB of memory per process: one at a time.
  worker-ocr-vision:
    build:
      context: ./worker/vision
      dockerfile: Dockerfile
    environment:
      <<: *ocr-pod-env
      # A model of the hub that reads images is asked through the backend's LLM proxy: no key of the hub in this pod.
      BACKEND_API_URL: http://backend:8000
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-only-worker-key-not-for-prod}
    depends_on:
      <<: *ocr-pod-depends-on
      backend:
        condition: service_started
    restart: unless-stopped

  # Read-only SQL over the typed copies of tabular files (#432): DuckDB, locked down, nothing but S3 and Redis.
  worker-tabular:
    build:
      context: ./worker/tabular
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_BUCKET: muffin-documents
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-agent-execution:
    build:
      context: ./worker/agent_execution
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_API_URL: http://backend:8000
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-only-worker-key-not-for-prod}
      # The tabular_query tool sends its SQL to worker-tabular (#433): the agent reads no file itself.
      # Only ever called when a run opted in (chat composer's web-search toggle, off by
      # default) - see worker/agent_execution/app/searxng_client.py.
      SEARXNG_URL: http://searxng:8080
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      searxng:
        condition: service_healthy
      worker-tabular:
        condition: service_started
    restart: unless-stopped

  worker-evaluation:
    build:
      context: ./worker/evaluation
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_API_URL: http://backend:8000
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-only-worker-key-not-for-prod}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  worker-document-edit:
    build:
      context: ./worker/document_edit
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_API_URL: http://backend:8000
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-only-worker-key-not-for-prod}
      # The edited draft and its source live in RustFS, like uploaded documents.
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_BUCKET: muffin-documents
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      rustfs:
        condition: service_healthy
    restart: unless-stopped

  # RustFS's image runs as non-root (uid 10001); named Docker volumes default
  # to root ownership, so this one-shot fixes permissions before rustfs starts.
  rustfs-volume-permissions:
    image: alpine
    volumes:
      - rustfs-data-0:/data0
      - rustfs-data-1:/data1
      - rustfs-data-2:/data2
      - rustfs-data-3:/data3
    command: chown -R 10001:10001 /data0 /data1 /data2 /data3
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin # dev only
      RUSTFS_SECRET_KEY: rustfsadmin # dev only
      # Named Docker volumes for the 4 erasure-set dirs all land on the same
      # physical disk, which RustFS refuses by default. Dev-only bypass.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-only-qdrant-key-not-for-prod}
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      # The image has neither curl nor wget: a raw /dev/tcp request, like keycloak's below. /readyz
      # answers without the API key.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://localhost:8085/
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8085:8080"
    healthcheck:
      # No curl in this image (Debian-slim + Python, not Alpine) - wget is.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muffin
      POSTGRES_PASSWORD: muffin
      POSTGRES_DB: muffin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muffin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # redis-stack-server, not plain redis: a superset (same commands Celery already uses work
    # unchanged) that also adds RediSearch, required by the agent_execution worker's Redis-backed
    # LangGraph checkpointer (a HITL pause must survive being resumed by a different Celery
    # prefork child than the one that paused it - see worker/agent_execution/app/agent_service.py).
    image: redis/redis-stack-server:7.4.0-v6
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./docker/keycloak/realm-muffin.json:/opt/keycloak/data/import/realm-muffin.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  postgres-data:
  rustfs-data-0:
  rustfs-data-1:
  rustfs-data-2:
  rustfs-data-3:
  qdrant-data:
