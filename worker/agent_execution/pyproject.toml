[project]
name = "muffin-worker-agent-execution"
version = "0.1.0"
description = "Celery worker that executes research agent runs (LangGraph orchestration)"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "loguru>=0.7.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-redis>=0.5.2",
    "duckdb>=1.4.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.15.0",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
env_files = ["tests/.env.testing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
