[project]
name = "muffin-worker-ocr-vision"
version = "0.42.0-rc"
description = "Celery worker that describes the images and tables of a scanned page (Florence-2 base)"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
    "loguru>=0.7.3",
    "boto3>=1.43.98",
    "pillow>=11.0.0",
    "numpy>=2.0",
    "httpx>=0.28.0",
    # Florence-2 is loaded with its own modeling code (trust_remote_code), which is written against one range of
    # transformers: pinned, and the code is in the image, at a pinned revision (see the Dockerfile).
    "transformers==4.49.0",
    "torch>=2.6.0",
    "einops>=0.8.0",
    "timm>=1.0.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
]
dev = [{ include-group = "test" }]

# CPU wheels only: the pod has no GPU, and the CUDA ones weigh gigabytes.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["slow: needs the real model in MODELS_DIR - skipped when it is not there"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
