[project]
name = "muffin-worker-tabular"
version = "0.35.0"
description = "Celery worker that runs read-only SQL over the Parquet copies of tabular files (DuckDB, locked down)"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "celery[redis]>=5.6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
    "loguru>=0.7.3",
    "boto3>=1.43.98",
    "duckdb>=1.4.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "ruff>=0.15.0",
    "pyarrow>=26.0.0",
    "pillow>=13.0.0",
]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
