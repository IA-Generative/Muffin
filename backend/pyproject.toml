[project]
name = "muffin-backend"
version = "0.6.0"
description = "Muffin BFF (Backend For Frontend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-keycloak>=7.1.1",
    "redis>=8.1.0",
    "pydantic-settings>=2.15.0",
    "loguru>=0.7.3",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.31.0",
    "alembic>=1.16.0",
    "openai>=3.16.2",
    "boto3>=1.43.98",
    "celery>=5.6.3",
    "python-multipart>=0.0.32",
    "meilisearch>=0.43.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
    "httpx>=0.28.1",
    "fakeredis>=2.38.0",
    "ruff>=0.15.0",
]
dev = [{ include-group = "test" }, "eralchemy2>=1.4.1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: app.db.engine is a module-level singleton,
# and asyncpg connections from its pool can't survive being reused across a
# per-test event loop (the pytest-asyncio default) - DB-backed tests would
# fail at teardown with "another operation is in progress".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
env_files = ["tests/.env.testing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
