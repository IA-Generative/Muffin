# Used by CI (and `make test-backend`) to run backend unit tests: just the
# stateful dependencies, no Keycloak - tests run with VERIFY_TOKEN_MODEL=full-access
# so authentication never needs a live Keycloak.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muffin
      POSTGRES_PASSWORD: muffin
      POSTGRES_DB: muffin
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muffin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
