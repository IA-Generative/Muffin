# Used by `make test-backend` to run backend unit tests: just the
# stateful dependencies (Postgres, Redis, Qdrant), no Keycloak - tests run with VERIFY_TOKEN_MODEL=full-access
# so authentication never needs a live Keycloak.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muffin
      POSTGRES_PASSWORD: muffin
      POSTGRES_DB: muffin
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muffin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A Vault in development mode (in memory, one unsealed node, a known root token) for the tests of the secret store
  # (#521): they turn Transit on and make their own key.
  vault-test:
    image: hashicorp/vault:1.18
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: test-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "58200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant-test:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "56333:6333"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
