name: Lint

# Kept local rather than delegated to fabnum-cicd: the shared catalogue has no
# frontend linter, and this one is a thin wrapper around each side's own
# tooling (typecheck for the frontend, ruff for the backend).

on:
  workflow_call:
    inputs:
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "22"
      PYTHON_VERSION:
        description: Python version used to run the backend linter
        required: false
        type: string
        default: "3.12"
  workflow_dispatch:
    inputs:
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "22"
      PYTHON_VERSION:
        description: Python version used to run the backend linter
        required: false
        type: string
        default: "3.12"

jobs:
  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

    - name: Set up pnpm
      uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
      with:
        # packageManager lives in frontend/package.json, not a root one (there
        # isn't one) - without this, the action has nothing to read a version from.
        package_json_file: frontend/package.json

    - name: Set up Node
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
      with:
        node-version: ${{ inputs.NODE_VERSION }}
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install frontend dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile

    - name: Typecheck frontend
      working-directory: frontend
      run: pnpm run typecheck

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: backend/uv.lock

    - name: Install backend dependencies
      working-directory: backend
      run: uv sync --group dev

    - name: Ruff check
      working-directory: backend
      run: uv run ruff check .

    - name: Ruff format check
      working-directory: backend
      run: uv run ruff format --check .

  lint-worker-document-process:
    name: Lint worker/document_process
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: worker/document_process/uv.lock

    - name: Install worker dependencies
      working-directory: worker/document_process
      run: uv sync --group dev

    - name: Ruff check
      working-directory: worker/document_process
      run: uv run ruff check .

    - name: Ruff format check
      working-directory: worker/document_process
      run: uv run ruff format --check .

  lint-worker-evaluation:
    name: Lint worker/evaluation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: worker/evaluation/uv.lock

    - name: Install worker dependencies
      working-directory: worker/evaluation
      run: uv sync --group dev

    - name: Ruff check
      working-directory: worker/evaluation
      run: uv run ruff check .

    - name: Ruff format check
      working-directory: worker/evaluation
      run: uv run ruff format --check .
