name: Lint

# Kept local rather than delegated to fabnum-cicd: the shared catalogue has no
# frontend linter, and this one is a thin wrapper around each side's own
# tooling (typecheck for the frontend, ruff for the backend).

on:
  workflow_call:
    inputs:
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "22"
      PYTHON_VERSION:
        description: Python version used to run the backend linter
        required: false
        type: string
        default: "3.12"
  workflow_dispatch:
    inputs:
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "22"
      PYTHON_VERSION:
        description: Python version used to run the backend linter
        required: false
        type: string
        default: "3.12"

jobs:
  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      with:
        # packageManager lives in frontend/package.json, not a root one (there
        # isn't one) - without this, the action has nothing to read a version from.
        package_json_file: frontend/package.json

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: ${{ inputs.NODE_VERSION }}
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install frontend dependencies
      working-directory: frontend
      run: pnpm install --frozen-lockfile

    - name: Typecheck frontend
      working-directory: frontend
      run: pnpm run typecheck

    # The utilities (src/utils/*.test.ts) run with Node's own test runner: no test framework to add.
    - name: Test frontend utilities
      working-directory: frontend
      run: pnpm run test

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: backend/uv.lock

    - name: Install backend dependencies
      working-directory: backend
      run: uv sync --group dev

    - name: Ruff check
      working-directory: backend
      run: uv run ruff check .

    - name: Ruff format check
      working-directory: backend
      run: uv run ruff format --check .

  lint-worker-document-process:
    name: Lint worker/document_process
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

