name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - "**"
  workflow_dispatch:

# Only the newest push to a pull request is worth building; cancel superseded
# runs rather than paying for images nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_AMD64: true
  BUILD_ARM64: false
  LATEST_TAG: false
  USE_QEMU: false
  TAG_SHORT_SHA: false
  CT_CONF_PATH: ci/configs/ct.yaml

jobs:
  path-filter:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      worker_document_process: ${{ steps.filter.outputs.worker_document_process }}
      worker_agent_execution: ${{ steps.filter.outputs.worker_agent_execution }}
      worker_evaluation: ${{ steps.filter.outputs.worker_evaluation }}
      worker_document_edit: ${{ steps.filter.outputs.worker_document_edit }}
      worker_ocr_layout: ${{ steps.filter.outputs.worker_ocr_layout }}
      worker_ocr: ${{ steps.filter.outputs.worker_ocr }}
      worker_ocr_table: ${{ steps.filter.outputs.worker_ocr_table }}
      helm: ${{ steps.filter.outputs.helm }}
      ci: ${{ steps.filter.outputs.ci }}
      services: ${{ steps.services.outputs.services }}
    steps:
      - name: Checks-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check updated files paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            worker_document_process:
              - 'worker/document_process/**'
            worker_agent_execution:
              - 'worker/agent_execution/**'
            worker_evaluation:
              - 'worker/evaluation/**'
            worker_document_edit:
              - 'worker/document_edit/**'
            worker_ocr_layout:
              - 'worker/layout/**'
            worker_ocr:
              - 'worker/ocr/**'
            worker_ocr_table:
              - 'worker/table/**'
            helm:
              - 'helm/**'
              - 'ci/configs/ct.yaml'
            ci:
              - '.github/workflows/**'

      - name: Select images to build
        id: services
        env:
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          WORKER_DOCUMENT_PROCESS: ${{ steps.filter.outputs.worker_document_process }}
          WORKER_AGENT_EXECUTION: ${{ steps.filter.outputs.worker_agent_execution }}
          WORKER_EVALUATION: ${{ steps.filter.outputs.worker_evaluation }}
          WORKER_DOCUMENT_EDIT: ${{ steps.filter.outputs.worker_document_edit }}
          WORKER_OCR_LAYOUT: ${{ steps.filter.outputs.worker_ocr_layout }}
          WORKER_OCR: ${{ steps.filter.outputs.worker_ocr }}
          WORKER_OCR_TABLE: ${{ steps.filter.outputs.worker_ocr_table }}
          CI: ${{ steps.filter.outputs.ci }}
        run: |
          set -euo pipefail

          SERVICES='[]'
          add() { SERVICES=$(jq -c --argjson s "$1" '. + [$s]' <<<"$SERVICES"); }

          if [ "$FRONTEND" = "true" ] || [ "$CI" = "true" ]; then
            add '{"name":"frontend","context":"frontend","dockerfile":"frontend/Dockerfile","target":"runtime"}'
          fi
          if [ "$BACKEND" = "true" ] || [ "$CI" = "true" ]; then
            add '{"name":"backend","context":"backend","dockerfile":"backend/Dockerfile","target":"runtime"}'
          fi
          if [ "$WORKER_DOCUMENT_PROCESS" = "true" ] || [ "$CI" = "true" ]; then
            add '{"name":"worker-document-process","context":"worker/document_process","dockerfile":"worker/document_process/Dockerfile","target":"runtime"}'
          fi
          if [ "$WORKER_AGENT_EXECUTION" = "true" ] || [ "$CI" = "true" ]; then
            add '{"name":"worker-agent-execution","context":"worker/agent_execution","dockerfile":"worker/agent_execution/Dockerfile","target":"runtime"}'
          fi
          if [ "$WORKER_EVALUATION" = "true" ] || [ "$CI" = "true" ]; then
            add '{"name":"worker-evaluation","context":"worker/evaluation","dockerfile":"worker/evaluation/Dockerfile","target":"runtime"}'
          fi
          if [ "$WORKER_DOCUMENT_EDIT" = "true" ] || [ "$CI" = "true" ]; then
            add '{"name":"worker-document-edit","context":"worker/document_edit","dockerfile":"worker/document_edit/Dockerfile","target":"runtime"}'
          fi
          if [ "$WORKER_OCR_LAYOUT" = "true" ] || [ "$CI" = "true" ]; then
            add '{"name":"worker-ocr-layout","context":"worker/layout","dockerfile":"worker/layout/Dockerfile","target":"runtime"}'
          fi
          if [ "$WORKER_OCR" = "true" ] || [ "$CI" = "true" ]; then
            add '{"name":"worker-ocr","context":"worker/ocr","dockerfile":"worker/ocr/Dockerfile","target":"runtime"}'
          fi
          if [ "$WORKER_OCR_TABLE" = "true" ] || [ "$CI" = "true" ]; then
            add '{"name":"worker-ocr-table","context":"worker/table","dockerfile":"worker/table/Dockerfile","target":"runtime"}'
          fi

          echo "Images to build: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  expose-vars:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions: {}
    outputs:
      BUILD_AMD64: ${{ env.BUILD_AMD64 }}
      BUILD_ARM64: ${{ env.BUILD_ARM64 }}
      LATEST_TAG: ${{ env.LATEST_TAG }}
      USE_QEMU: ${{ env.USE_QEMU }}
      TAG_SHORT_SHA: ${{ env.TAG_SHORT_SHA }}
      CT_CONF_PATH: ${{ env.CT_CONF_PATH }}
      IMAGE_BASE: ${{ steps.image.outputs.IMAGE_BASE }}
      IMAGE_TAG: ${{ steps.image.outputs.IMAGE_TAG }}
    steps:
      - name: Exposing env vars
        run: echo "Exposing env vars"

      - name: Compute image base and tag
        id: image
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.number || '' }}
        run: |
          set -euo pipefail

          echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

          if [ -n "$PR_NUMBER" ]; then
            IMAGE_TAG="pr-$PR_NUMBER"
          else
            IMAGE_TAG=$(printf '%s' "${GITHUB_REF_NAME,,}" | tr -c 'a-z0-9._-' '-')
          fi
          echo "Image tag: $IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  lint-commits:
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-commits.yml@v0
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      pull-requests: read
      contents: read

  lint:
    uses: ./.github/workflows/lint.yml
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.frontend == 'true' || needs.path-filter.outputs.backend == 'true' || needs.path-filter.outputs.worker_document_process == 'true' || needs.path-filter.outputs.worker_agent_execution == 'true' || needs.path-filter.outputs.worker_evaluation == 'true' || needs.path-filter.outputs.worker_document_edit == 'true' || needs.path-filter.outputs.worker_ocr_layout == 'true' || needs.path-filter.outputs.worker_ocr == 'true' || needs.path-filter.outputs.worker_ocr_table == 'true' || needs.path-filter.outputs.ci == 'true' }}
    permissions:
      contents: read

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    needs:
      - path-filter
    if: ${{ needs.path-filter.outputs.backend == 'true' || needs.path-filter.outputs.worker_document_process == 'true' || needs.path-filter.outputs.worker_agent_execution == 'true' || needs.path-filter.outputs.worker_evaluation == 'true' || needs.path-filter.outputs.worker_document_edit == 'true' || needs.path-filter.outputs.worker_ocr_layout == 'true' || needs.path-filter.outputs.worker_ocr == 'true' || needs.path-filter.outputs.worker_ocr_table == 'true' || needs.path-filter.outputs.ci == 'true' }}
    permissions:
      contents: read

  scan-gitleaks:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-gitleaks.yml@v0
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.number || '' }}
      GITHUB_SECURITY_TAB: true

  scan-trivy-conf:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-trivy.yml@v0
    needs:
      - expose-vars
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      packages: read
    with:
      PATH: ./
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.number || '' }}
      FORMAT: sarif
      GITHUB_SECURITY_TAB: true
      CATEGORY: trivy-config
      TRIVYIGNORES: .trivyignore.yaml

  # The scans above report everything to the Security tab and never fail. These two gate the
  # merge on what has to be fixed now, and report nothing else (a SEVERITY filter also narrows
  # the SARIF, so it can't be set on the reporting scans without hiding the rest from the tab):
  # configuration findings of high or critical severity, which are always fixable. To accept
  # one, see docs/security-scans.md.
  gate-trivy-conf:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-trivy.yml@v0
    needs:
      - expose-vars
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      packages: read
    with:
      PATH: ./
      FORMAT: table
      SEVERITY: CRITICAL,HIGH
      FAIL_ON_ERROR: true
      TRIVYIGNORES: .trivyignore.yaml

  build-docker:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    needs:
      - path-filter
      - expose-vars
    if: ${{ needs.path-filter.outputs.services != '[]' }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.path-filter.outputs.services) }}
    with:
      IMAGE_NAME: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/${{ matrix.service.name }}
      IMAGE_TAG: ${{ needs.expose-vars.outputs.IMAGE_TAG }}
      IMAGE_CONTEXT: ${{ matrix.service.context }}
      IMAGE_DOCKERFILE: ${{ matrix.service.dockerfile }}
      IMAGE_TARGET: ${{ matrix.service.target }}
      BUILD_AMD64: ${{ needs.expose-vars.outputs.BUILD_AMD64 == 'true' }}
      BUILD_ARM64: ${{ needs.expose-vars.outputs.BUILD_ARM64 == 'true' }}
      LATEST_TAG: ${{ needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      TAG_SHORT_SHA: ${{ needs.expose-vars.outputs.TAG_SHORT_SHA == 'true' }}
      CACHE: true
      CACHE_MODE: min
      BUILD_ARGS: |
        APP_VERSION=${{ needs.expose-vars.outputs.IMAGE_TAG }}

  scan-trivy-images:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-trivy.yml@v0
    needs:
      - path-filter
      - expose-vars
      - build-docker
    if: ${{ needs.path-filter.outputs.services != '[]' }}
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.path-filter.outputs.services) }}
    with:
      IMAGE: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/${{ matrix.service.name }}:${{ needs.expose-vars.outputs.IMAGE_TAG }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.number || '' }}
      FORMAT: sarif
      GITHUB_SECURITY_TAB: true
      CATEGORY: trivy-image-${{ matrix.service.name }}
      TRIVYIGNORES: .trivyignore.yaml

  # Critical vulnerabilities that already have a fix (the image scan always ignores unfixed ones):
  # whatever lands here can be solved by rebuilding on a newer base or bumping a dependency.
  # See gate-trivy-conf above for why this is separate from scan-trivy-images.
  gate-trivy-images:
    uses: dnum-mi/fabnum-cicd/.github/workflows/scan-trivy.yml@v0
    needs:
      - path-filter
      - expose-vars
      - build-docker
    if: ${{ needs.path-filter.outputs.services != '[]' }}
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.path-filter.outputs.services) }}
    with:
      IMAGE: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/${{ matrix.service.name }}:${{ needs.expose-vars.outputs.IMAGE_TAG }}
      FORMAT: table
      SEVERITY: CRITICAL
      FAIL_ON_ERROR: true
      TRIVYIGNORES: .trivyignore.yaml

  lint-helm:
    uses: dnum-mi/fabnum-cicd/.github/workflows/lint-helm.yml@v0
    needs:
      - path-filter
      - expose-vars
    if: ${{ needs.path-filter.outputs.helm == 'true' || needs.path-filter.outputs.ci == 'true' }}
    permissions:
      contents: read
    with:
      CT_CONF_PATH: ${{ needs.expose-vars.outputs.CT_CONF_PATH }}
      CHARTS_DIR: helm
      HELM_DOCS_VERSION: v1.14.2

  # Workaround for required status check in protection branches (see. https://github.com/orgs/community/discussions/13690)
  all-jobs-passed:
    name: Check jobs status
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions: {}
    # Every job in this workflow must be listed here, or a failure in the
    # missing one leaves the gate green and the branch mergeable.
    needs:
      - path-filter
      - expose-vars
      - lint-commits
      - lint
      - unit-tests
      - scan-gitleaks
      - scan-trivy-conf
      - gate-trivy-conf
      - build-docker
      - scan-trivy-images
      - gate-trivy-images
      - lint-helm
    steps:
      - name: Check status of all required jobs
        run: |-
          NEEDS_CONTEXT='${{ toJson(needs) }}'
          JOB_IDS=$(echo "$NEEDS_CONTEXT" | jq -r 'keys[]')
          for JOB_ID in $JOB_IDS; do
            RESULT=$(echo "$NEEDS_CONTEXT" | jq -r ".[\"$JOB_ID\"].result")
            echo "$JOB_ID job result: $RESULT"
            if [[ $RESULT != "success" && $RESULT != "skipped" ]]; then
              echo "***"
              echo "Error: The $JOB_ID job did not pass."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
