        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/document_process/uv.lock

      - name: Install worker dependencies
        working-directory: worker/document_process
        run: uv sync --group dev

      - name: Run tests
        working-directory: worker/document_process
        run: uv run --with pytest-cov pytest --cov=app --cov-branch --cov-report=lcov:lcov.info

      - name: CRAP gate
        uses: ./.github/actions/crap-gate
        with:
          working-directory: worker/document_process
          max-crap: "110"

