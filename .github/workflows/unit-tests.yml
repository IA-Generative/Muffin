name: Unit Tests

# Backend only for now: the frontend has no unit test suite yet (see
# frontend/scripts/screenshot.mjs - visual checks only), just typecheck+build
# covered by lint.yml. Add a frontend job here once one exists.
#
# The Python workers (document_process, evaluation, document_edit) run
# the same uv sync --group dev + pytest pattern.
#
# Each Python job then scores the functions it tested (CRAP: complexity made worse by what is not covered), see
# .github/actions/crap-gate. The ceiling of a project is 30, or its worst score today when it already has functions over
# it - lower it as they are cut up or tested, never raise it.

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run backend tests
        required: false
        type: string
        default: "3.12"
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run backend tests
        required: false
        type: string
        default: "3.12"

jobs:
  unit-tests-backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: muffin
          POSTGRES_PASSWORD: muffin
          POSTGRES_DB: muffin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muffin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # No health check: the image has neither curl nor wget - the step below waits for it instead.
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
    env:
      # The vector store tests also run against this server (they fail, rather than skip, if it is down).
      QDRANT_TEST_URL: http://localhost:6333
      DATABASE_URL: postgresql+asyncpg://muffin:muffin@localhost:5432/muffin
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Wait for Qdrant
        run: curl --retry 30 --retry-delay 1 --retry-connrefused -fsS http://localhost:6333/readyz

      - name: Apply database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: uv run pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=lcov:lcov.info

      - name: CRAP gate
        uses: ./.github/actions/crap-gate
        with:
          working-directory: backend
          max-crap: "760"

  unit-tests-worker-document-process:
    name: worker/document_process
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
