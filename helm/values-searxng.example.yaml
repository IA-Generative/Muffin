# Example override for the searxng subchart (see Chart.yaml's `dependencies`), meant to be
# passed with `-f` alongside the chart's own values file:
#   helm upgrade --install muffin . -f values.yaml -f values-searxng.example.yaml
#
# Only `config.settings.data` needs overriding: it's the chart's default settings.yml, and the
# defaults ship with the JSON API disabled and a public, chart-baked secret_key - both unsafe to
# run with as-is (worker/agent_execution/app/searxng_client.py needs the JSON API, and reusing a
# secret_key that ships in a public chart defeats its point). Everything else (limiter, uwsgi,
# resources, ingress...) is left to the chart's own defaults for now; enrich this file as those
# needs come up rather than guessing them ahead of time.
searxng:
  enabled: true
  config:
    settings:
      enabled: true
      data: |-
        use_default_settings: true

        server:
          # Generate a real one per environment: `openssl rand -hex 32`. Never reuse this
          # placeholder or the chart's own baked-in default - both are public.
          secret_key: "REPLACE_ME_WITH_A_GENERATED_SECRET"
          limiter: false
          image_proxy: true
          port: 8080
          bind_address: "0.0.0.0"

        ui:
          static_use_hash: true

        search:
          safe_search: 0
          autocomplete: ""
          default_lang: ""
          formats:
            - html
            - json
