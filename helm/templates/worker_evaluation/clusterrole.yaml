{{- if .Values.enabled }}
{{- if and .Values.worker_evaluation.serviceAccount.enabled .Values.worker_evaluation.serviceAccount.clusterRole.create .Values.worker_evaluation.serviceAccount.clusterRole.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_evaluation") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_evaluation")) | nindent 4 }}
rules: {{- toYaml .Values.worker_evaluation.serviceAccount.clusterRole.rules | nindent 0 }}
{{- end }}
{{- end }}
