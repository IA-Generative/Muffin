{{- if .Values.enabled }}
{{- if eq .Values.worker_evaluation.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_evaluation") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_evaluation")) | nindent 4 }}
spec:
  {{- if not .Values.worker_evaluation.autoscaling.enabled }}
  replicas: {{ .Values.worker_evaluation.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.worker_evaluation.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_evaluation") | nindent 6 }}
  strategy:
    type: {{ .Values.worker_evaluation.strategy.type }}
    {{- if eq .Values.worker_evaluation.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.worker_evaluation.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.worker_evaluation.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_evaluation" "component" .Values.worker_evaluation) | nindent 4 }}
{{- end }}
{{- end }}
