{{- if .Values.enabled }}
{{- /* KEDA autoscaling of a component on the length of the Redis lists (Celery queues) it reads: any top-level
value that has a `kedaAutoscaler` map and has it enabled gets a ScaledObject and the TriggerAuthentication that
gives KEDA the Redis password. KEDA is not Sentinel-aware, so it polls the Redis Service directly. A component is
scaled by KEDA or by its HPA (`autoscaling`), never both: the two would fight over the replicas. */ -}}
{{- range $component, $values := .Values }}
{{- if and (kindIs "map" $values) (hasKey $values "kedaAutoscaler") $values.kedaAutoscaler.enabled }}
{{- $keda := $values.kedaAutoscaler }}
{{- if and (hasKey $values "autoscaling") $values.autoscaling.enabled }}
{{- fail (printf "%s: autoscaling (HPA) and kedaAutoscaler cannot both be enabled" $component) }}
{{- end }}
{{- if not $keda.queues }}
{{- fail (printf "%s.kedaAutoscaler.queues: at least one Redis list is required" $component) }}
{{- end }}
{{- $name := include "helper.componentFullname" (dict "root" $ "componentName" $component) }}
{{- $redisName := ($.Values.redis | default dict).fullnameOverride | default (printf "%s-redis" (include "helper.fullname" $)) }}
{{- $address := $keda.redis.address | default (printf "%s.%s.svc.cluster.local:6379" $redisName $.Release.Namespace) }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $name }}-keda
  labels: {{- (include "helper.labels" (dict "root" $ "componentName" $component)) | nindent 4 }}
spec:
  secretTargetRef:
  - parameter: password
    name: {{ $keda.redis.secretRef | quote }}
    key: {{ $keda.redis.secretKey | quote }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels: {{- (include "helper.labels" (dict "root" $ "componentName" $component)) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ $values.deploymentType }}
    name: {{ $name }}
  minReplicaCount: {{ $keda.minReplicaCount }}
  maxReplicaCount: {{ $keda.maxReplicaCount }}
  pollingInterval: {{ $keda.pollingInterval }}
  {{- if $keda.cooldownPeriod }}
  cooldownPeriod: {{ $keda.cooldownPeriod }}
  {{- end }}
  triggers:
  {{- range $keda.queues }}
  - type: redis
    metricType: AverageValue
    metadata:
      address: {{ $address | quote }}
      listName: {{ . | quote }}
      listLength: {{ $keda.listLength | quote }}
    authenticationRef:
      name: {{ $name }}-keda
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
