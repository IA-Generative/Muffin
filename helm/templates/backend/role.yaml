{{- if .Values.enabled }}
{{- if and .Values.backend.serviceAccount.enabled .Values.backend.serviceAccount.role.create .Values.backend.serviceAccount.role.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "backend")) | nindent 4 }}
rules: {{- toYaml .Values.backend.serviceAccount.role.rules | nindent 0 }}
{{- end }}
{{- end }}
