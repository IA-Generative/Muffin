{{- if .Values.enabled }}
{{- if eq .Values.backend.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "backend") | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.backend.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "backend") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "backend") }}
  {{- with .Values.backend.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "backend" "component" .Values.backend) | nindent 4 }}
  {{- if or .Values.backend.volumeClaims .Values.backend.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.backend.volumeClaims) (default (list) .Values.backend.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
