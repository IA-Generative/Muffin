{{- if and .Values.enabled .Values.tts.enabled }}
{{- /* Gated on `rules` as well, exactly like clusterrole.yaml: without it, an empty `rules` list
yields a ClusterRoleBinding whose roleRef points at a ClusterRole that was never created. */ -}}
{{- if and .Values.tts.serviceAccount.enabled .Values.tts.serviceAccount.clusterRole.create .Values.tts.serviceAccount.clusterRole.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "tts") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "tts")) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "tts") }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.tts.serviceAccount.name | default (include "helper.componentFullname" (dict "root" . "componentName" "tts")) }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
