{{- if and .Values.enabled .Values.tts.enabled }}
{{- if or .Values.tts.envSecret .Values.global.envSecret -}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "tts") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "tts")) | nindent 4 }}
data:
  {{- if .Values.global.envSecret -}}
  {{- include "helper.secret" (dict "root" . "data" .Values.global.envSecret) | indent 2 }}
  {{- end -}}
  {{- if .Values.tts.envSecret -}}
  {{- include "helper.secret" (dict "root" . "data" .Values.tts.envSecret) | indent 2 }}
  {{- end -}}
{{- end -}}
{{- end }}
