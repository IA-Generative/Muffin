{{- if and .Values.enabled .Values.tts.enabled }}
{{- if and .Values.tts.serviceAccount.enabled .Values.tts.serviceAccount.role.create .Values.tts.serviceAccount.role.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "tts") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "tts")) | nindent 4 }}
rules: {{- toYaml .Values.tts.serviceAccount.role.rules | nindent 0 }}
{{- end }}
{{- end }}
