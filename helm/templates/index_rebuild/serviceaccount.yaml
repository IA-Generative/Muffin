{{- if .Values.enabled }}
{{- if and .Values.index_rebuild.serviceAccount.enabled .Values.index_rebuild.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.index_rebuild.serviceAccount.name | default (include "helper.componentFullname" (dict "root" . "componentName" "index_rebuild")) }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "index_rebuild")) | nindent 4 }}
  {{- if .Values.index_rebuild.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .Values.index_rebuild.serviceAccount.annotations) . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.index_rebuild.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
