{{- if .Values.enabled }}
{{- if and .Values.index_rebuild.serviceAccount.enabled .Values.index_rebuild.serviceAccount.clusterRole.create .Values.index_rebuild.serviceAccount.clusterRole.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "index_rebuild") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "index_rebuild")) | nindent 4 }}
rules: {{- toYaml .Values.index_rebuild.serviceAccount.clusterRole.rules | nindent 0 }}
{{- end }}
{{- end }}
