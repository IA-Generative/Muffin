{{- if .Values.enabled }}
{{- if eq .Values.index_rebuild.deploymentType "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "index_rebuild") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "index_rebuild")) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.index_rebuild.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "index_rebuild") | nindent 6 }}
  {{- with .Values.index_rebuild.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "index_rebuild" "component" .Values.index_rebuild) | nindent 4 }}
{{- end }}
{{- end }}
