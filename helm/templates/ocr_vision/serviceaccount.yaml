{{- if .Values.enabled }}
{{- if and .Values.ocr_vision.serviceAccount.enabled .Values.ocr_vision.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.ocr_vision.serviceAccount.name | default (include "helper.componentFullname" (dict "root" . "componentName" "ocr_vision")) }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "ocr_vision")) | nindent 4 }}
  {{- if .Values.ocr_vision.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .Values.ocr_vision.serviceAccount.annotations) . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.ocr_vision.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
