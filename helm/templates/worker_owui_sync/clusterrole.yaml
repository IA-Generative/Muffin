{{- if .Values.enabled }}
{{- if and .Values.worker_owui_sync.serviceAccount.enabled .Values.worker_owui_sync.serviceAccount.clusterRole.create .Values.worker_owui_sync.serviceAccount.clusterRole.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_owui_sync") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "worker_owui_sync")) | nindent 4 }}
rules: {{- toYaml .Values.worker_owui_sync.serviceAccount.clusterRole.rules | nindent 0 }}
{{- end }}
{{- end }}
