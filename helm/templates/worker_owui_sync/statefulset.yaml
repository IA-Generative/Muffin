{{- if .Values.enabled }}
{{- if eq .Values.worker_owui_sync.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_owui_sync") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "worker_owui_sync") | nindent 4 }}
spec:
  {{- if not .Values.worker_owui_sync.autoscaling.enabled }}
  replicas: {{ .Values.worker_owui_sync.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.worker_owui_sync.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "worker_owui_sync") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "worker_owui_sync") }}
  {{- with .Values.worker_owui_sync.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "worker_owui_sync" "component" .Values.worker_owui_sync) | nindent 4 }}
  {{- if or .Values.worker_owui_sync.volumeClaims .Values.worker_owui_sync.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.worker_owui_sync.volumeClaims) (default (list) .Values.worker_owui_sync.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
