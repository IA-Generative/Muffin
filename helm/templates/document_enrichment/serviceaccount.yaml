{{- if .Values.enabled }}
{{- if and .Values.document_enrichment.serviceAccount.enabled .Values.document_enrichment.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.document_enrichment.serviceAccount.name | default (include "helper.componentFullname" (dict "root" . "componentName" "document_enrichment")) }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "document_enrichment")) | nindent 4 }}
  {{- if .Values.document_enrichment.serviceAccount.annotations }}
  annotations:
    {{- tpl (toYaml .Values.document_enrichment.serviceAccount.annotations) . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.document_enrichment.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
