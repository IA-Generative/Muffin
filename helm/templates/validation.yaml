{{- /*
Values validation only - this template intentionally renders no resource. It exists so
`helper.component.validate` runs on every `helm template`/`helm lint`/`helm install`, including
for combinations where the workload templates themselves would render nothing (e.g. an unknown
`deploymentType`, which would otherwise silently produce a release with no workload at all).
Add one `include` line per component when you add components to this chart.
*/ -}}
{{- if .Values.enabled }}
{{- include "helper.component.validate" (dict "name" "backend" "component" .Values.backend) }}
{{- include "helper.component.validate" (dict "name" "frontend" "component" .Values.frontend) }}
{{- include "helper.component.validate" (dict "name" "document_process" "component" .Values.document_process) }}
{{- include "helper.component.validate" (dict "name" "agent_execution" "component" .Values.agent_execution) }}
{{- include "helper.component.validate" (dict "name" "document_enrichment" "component" .Values.document_enrichment) }}
{{- include "helper.component.validate" (dict "name" "ocr_layout" "component" .Values.ocr_layout) }}
{{- include "helper.component.validate" (dict "name" "ocr" "component" .Values.ocr) }}
{{- include "helper.component.validate" (dict "name" "ocr_table" "component" .Values.ocr_table) }}
{{- include "helper.component.validate" (dict "name" "ocr_vision" "component" .Values.ocr_vision) }}
{{- include "helper.component.validate" (dict "name" "tabular" "component" .Values.tabular) }}
{{- include "helper.component.validate" (dict "name" "index_rebuild" "component" .Values.index_rebuild) }}
{{- include "helper.component.validate" (dict "name" "worker_owui_sync" "component" .Values.worker_owui_sync) }}
{{- end }}
