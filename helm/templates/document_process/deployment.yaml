{{- if .Values.enabled }}
{{- if eq .Values.document_process.deploymentType "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "document_process") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "document_process")) | nindent 4 }}
spec:
  {{- if not .Values.document_process.autoscaling.enabled }}
  replicas: {{ .Values.document_process.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.document_process.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "document_process") | nindent 6 }}
  strategy:
    type: {{ .Values.document_process.strategy.type }}
    {{- if eq .Values.document_process.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.document_process.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.document_process.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "document_process" "component" .Values.document_process) | nindent 4 }}
{{- end }}
{{- end }}
