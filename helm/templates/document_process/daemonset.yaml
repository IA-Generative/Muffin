{{- if .Values.enabled }}
{{- if eq .Values.document_process.deploymentType "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "document_process") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "document_process")) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.document_process.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "document_process") | nindent 6 }}
  {{- with .Values.document_process.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "document_process" "component" .Values.document_process) | nindent 4 }}
{{- end }}
{{- end }}
