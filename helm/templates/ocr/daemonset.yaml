{{- if .Values.enabled }}
{{- if eq .Values.ocr.deploymentType "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "ocr") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "ocr")) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.ocr.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "ocr") | nindent 6 }}
  {{- with .Values.ocr.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "ocr" "component" .Values.ocr) | nindent 4 }}
{{- end }}
{{- end }}
