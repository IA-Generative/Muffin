{{- if .Values.enabled }}
{{- if .Values.ocr.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "ocr") }}
  labels: {{- (include "helper.labels" (dict "root" . "componentName" "ocr")) | nindent 4 }}
  {{- if .Values.ocr.pdb.labels }}
    {{- toYaml .Values.ocr.pdb.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.ocr.pdb.annotations }}
  annotations: {{- toYaml .Values.ocr.pdb.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- /* Tested against the empty string rather than for truthiness: `maxUnavailable: 0` is a valid
  setting (it blocks every voluntary eviction) but is falsy, so `with`/`if` would silently fall
  through to minAvailable. `toString` maps both nil and "" to "", which are the two unset forms.
  `helper.component.validate` guarantees at least one of the two is set. */ -}}
  {{- if ne (toString .Values.ocr.pdb.maxUnavailable) "" }}
  maxUnavailable: {{ .Values.ocr.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.ocr.pdb.minAvailable }}
  {{- end }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "ocr") | nindent 6 }}
{{- end }}
{{- end }}
