{{- if .Values.enabled }}
{{- if eq .Values.ocr.deploymentType "StatefulSet" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.componentFullname" (dict "root" . "componentName" "ocr") }}
  labels: {{- include "helper.labels" (dict "root" . "componentName" "ocr") | nindent 4 }}
spec:
  {{- if not .Values.ocr.autoscaling.enabled }}
  replicas: {{ .Values.ocr.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.ocr.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels: {{- include "helper.selectorLabels" (dict "root" . "componentName" "ocr") | nindent 6 }}
  serviceName: {{ include "helper.componentFullname" (dict "root" . "componentName" "ocr") }}
  {{- with .Values.ocr.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    {{- include "helper.component.podTemplate" (dict "root" . "name" "ocr" "component" .Values.ocr) | nindent 4 }}
  {{- if or .Values.ocr.volumeClaims .Values.ocr.extraVolumeClaims }}
  volumeClaimTemplates: {{- toYaml (concat (default (list) .Values.ocr.volumeClaims) (default (list) .Values.ocr.extraVolumeClaims)) | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
