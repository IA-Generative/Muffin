apiVersion: v2
name: muffin
type: application
version: 0.10.0
appVersion: "0.12.0"
description: A Helm chart to deploy Muffin.
# Floor set by the core APIs the chart renders (autoscaling/v2, policy/v1). The Gateway API
# resources additionally need the gateway.networking.k8s.io CRDs installed in the cluster.
kubeVersion: ">=1.25.0-0"
# home: https://this-is-tobi.com
deprecated: false
annotations: {}
#   artifacthub.io/category: storage
#   artifacthub.io/license: MIT
#   artifacthub.io/changes: |
#     - kind: changed
#       description: Upgrade backup image to v1.0.1
#     - kind: fixed
#       description: Remove podMonitor template that is natively handle by operator
keywords: []
dependencies:
  - name: redis
    alias: redis
    version: 0.27.9
    repository: oci://registry-1.docker.io/cloudpirates
    condition: redis.enabled
  - name: postgres
    alias: postgres
    version: 0.19.6
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: rustfs
    alias: rustfs
    version: 0.10.0
    repository: oci://registry-1.docker.io/cloudpirates
    condition: rustfs.enabled
  - name: cluster
    alias: cnpg
    version: 0.8.1
    repository: https://cloudnative-pg.github.io/charts
    condition: cnpg.enabled
  - name: meilisearch
    repository: https://meilisearch.github.io/meilisearch-kubernetes
    version: 0.39.0
    condition: meilisearch.enabled
  - name: searxng
    repository: https://unknowniq.github.io/helm-charts
    version: 0.1.11
    condition: searxng.enabled
sources: []
# - https://github.com/this-is-tobi/helm-charts
maintainers: []
