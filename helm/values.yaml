  # it (see the `VaultStaticSecret` example under `extraObjects`).
  # @section -- Tabular
  envSecret: {}
  # E: "E"
  ## Each probe is rendered verbatim via `toYaml`, so any `Probe` field (`exec`, `tcpSocket`,
  ## `grpc`...) is accepted, not just the `httpGet` shown here. To DISABLE a probe, set it to
  ## `null` - `{}` does not work, because Helm deep-merges values files and would merge these
  ## defaults straight back in.
  probes:
    startupProbe:
      # -- Tabular container healthcheck (startupProbe is defined using `toYaml` so it is possible to override it completely).
      # Uses `celery inspect ping` since Celery workers don't expose an HTTP endpoint.
      # @section -- Tabular
      exec:
        command:
          - celery
          - -A
          - app.celery_app
          - inspect
          - ping
          - -d
          - celery@$(HOSTNAME)
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Tabular
      initialDelaySeconds: 0
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Tabular
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Tabular
      failureThreshold: 10
      # -- How often (in seconds) to perform the probe.
      # @section -- Tabular
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Tabular
      timeoutSeconds: 5
    readinessProbe:
      # -- Tabular container healthcheck (readinessProbe is defined using `toYaml` so it is possible to override it completely).
      # Uses `celery inspect ping` since Celery workers don't expose an HTTP endpoint.
      # @section -- Tabular
      exec:
        command:
          - celery
          - -A
          - app.celery_app
          - inspect
          - ping
          - -d
          - celery@$(HOSTNAME)
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Tabular
      initialDelaySeconds: 10
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Tabular
      successThreshold: 2
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Tabular
      failureThreshold: 2
      # -- How often (in seconds) to perform the probe.
      # @section -- Tabular
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Tabular
      timeoutSeconds: 5
    livenessProbe:
      # -- Tabular container healthcheck (livenessProbe is defined using `toYaml` so it is possible to override it completely).
      # Uses `celery inspect ping` since Celery workers don't expose an HTTP endpoint.
      # @section -- Tabular
      exec:
        command:
          - celery
          - -A
          - app.celery_app
          - inspect
          - ping
          - -d
          - celery@$(HOSTNAME)
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Tabular
      initialDelaySeconds: 30
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Tabular
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Tabular
      failureThreshold: 3
      # -- How often (in seconds) to perform the probe.
      # @section -- Tabular
      periodSeconds: 30
      # -- Number of seconds after which the probe times out.
      # @section -- Tabular
      timeoutSeconds: 5
