# -- Master switch for the whole chart. When `false`, every template renders nothing - use this
# to keep a release/namespace registered with a deployment system (e.g. an ArgoCD Application
# that always gets generated for every app/env combination) without actually deploying any
# resource into it. Note this does NOT cover subchart dependencies added via `Chart.yaml` (e.g. a
# bundled database/cache) - those still need their own `enabled: false` alongside this one.
# @section -- General
enabled: true
# -- Provide a name in place of the default application name.
# @section -- General
nameOverride: ""
# -- String to fully override the default application name.
# @section -- General
fullnameOverride: ""
# -- Add labels to all the deployed resources
# @section -- General
commonLabels: {}
global:
  # -- List or map of `configMapRef`/`secretRef` entries to load into every container's
  # `envFrom` (merged with each component's own `envFrom`, global entries first).
  # @section -- Global
  envFrom: []
  # - configMapRef:
  #     name: "my-config"
  # - secretRef:
  #     name: "my-secret"
  #
  # my-config:
  #   configMapRef:
  #     name: "my-config"
  # my-secret:
  #   secretRef:
  #     name: "my-secret"
  # -- Map or array of environment variables to inject into all containers (`valueFrom` supported).
  # @section -- Global
  env: {}
  # A: "A"
  # B:
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # C:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  #
  # - name: "A"
  #   value: "A"
  # - name: "B"
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # - name: "C"
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  # -- Map of environment variables to inject into a configmap loaded by all containers (`valueFrom` not supported).
  # @section -- Global
  envCm: {}
  # D: "D"
  # -- Map of environment variables to inject into a secret loaded by all containers (`valueFrom` not supported).
  # @section -- Global
  envSecret: {}
  # E: "E"

  # -- Global Docker image registry
  # @section -- Global
  imageRegistry: ""
  # -- Image credentials applied to every component in addition to any component-specific `imagePullSecrets`.
  # @section -- Global
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
  #   username: ""
  #   password: ""
  #   email: ""
  ## Chart-level Ingress, for fanning several components (or several charts) behind one hostname.
  ## Unlike `backend.ingress` it has no default backend, so every path must name the service
  ## it routes to - rendering would otherwise point at a Service that does not exist.
  ingress:
    # -- Whether or not the chart-level ingress should be enabled.
    # @section -- Global
    enabled: false
    # -- Defines which ingress controller will implement the resource.
    # @section -- Global
    className: ""
    # -- Additional ingress annotations.
    # @section -- Global
    annotations: {}
    # -- Additional ingress labels.
    # @section -- Global
    labels: {}
    # -- Hosts and paths served by the chart-level ingress. Each path's `backend.serviceName` is
    # required (see above); `backend.portNumber` defaults to 80.
    # @section -- Global
    hosts: []
    # - name: "domain.local"
    #   paths:
    #   - path: "/"
    #     pathType: "Prefix"
    #     backend:
    #       serviceName: "my-web-service"
    #       portNumber: 80
    #   - path: "/api"
    #     pathType: "Prefix"
    #     backend:
    #       serviceName: "my-api-service"
    #       portNumber: 8080
    # -- TLS configuration for the chart-level ingress.
    # @section -- Global
    tls: []
    # - secretName: domain.local-tls
    #   hosts:
    #   - domain.local
  ## Chart-level Gateway API HTTPRoute, same rationale as `global.ingress` above: `rules` and their
  ## `backendRefs[].name` are required because there is no default backend to fall back to.
  httpRoute:
    # -- Whether or not the chart-level HTTPRoute should be enabled.
    # @section -- Global
    enabled: false
    # -- Additional HTTPRoute annotations.
    # @section -- Global
    annotations: {}
    # -- Additional HTTPRoute labels.
    # @section -- Global
    labels: {}
    # -- Parent references (Gateways) to attach the HTTPRoute to.
    # @section -- Global
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace
    #   sectionName: https
    # -- Hostnames for the HTTPRoute to match.
    # @section -- Global
    hostnames: []
    # - "example.com"
    # - "*.example.com"
    # -- Routing rules for the HTTPRoute. Required when `enabled` is true, and every `backendRefs`
    # entry must carry a `name`.
    # @section -- Global
    rules: []
    # - matches:
    #   - path:
    #       type: PathPrefix
    #       value: "/"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #     queryParams:
    #     - type: Exact
    #       name: "debug"
    #       value: "true"
    #     method: GET
    #   filters:
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       add:
    #       - name: "x-custom-header"
    #         value: "my-value"
    #   backendRefs:
    #   - name: my-service
    #     port: 80
    #     weight: 100
## Gateway API configuration (alternative to Ingress)
## Ref: https://gateway-api.sigs.k8s.io/
gateway:
  # -- Create a Gateway resource. Usually, you reference an existing Gateway managed by the infrastructure team.
  # @section -- Global
  create: false
  # -- Name of the Gateway resource. If not set, uses the release fullname.
  # @section -- Global
  name: ""
  # -- GatewayClass name. Required when creating a Gateway.
  # @section -- Global
  className: ""
  # -- Additional gateway annotations.
  # @section -- Global
  annotations: {}
  # -- Additional gateway labels.
  # @section -- Global
  labels: {}
  # -- Gateway addresses configuration.
  # @section -- Global
  addresses: []
  # - type: IPAddress
  #   value: "192.168.1.100"
  # - type: Hostname
  #   value: "gateway.example.com"
  # -- Gateway listeners configuration.
  # @section -- Global
  listeners: []
  # - name: http
  #   port: 80
  #   protocol: HTTP
  #   hostname: "*.example.com"
  #   allowedRoutes:
  #     namespaces:
  #       from: Same  # Same, All, or Selector
  #     kinds:
  #     - kind: HTTPRoute
  # - name: https
  #   port: 443
  #   protocol: HTTPS
  #   hostname: "*.example.com"
  #   tls:
  #     mode: Terminate  # Terminate or Passthrough
  #     certificateRefs:
  #     - kind: Secret
  #       name: example-com-tls
  #   allowedRoutes:
  #     namespaces:
  #       from: Same
backend:
  # -- Workload kind to deploy the app as. One of "Deployment", "StatefulSet" or "DaemonSet"
  # (validated at render time - an unknown value fails instead of producing a release with no
  # workload). Use the top-level `jobs` / `cronjobs` maps for one-off or scheduled workloads.
  # Some values only apply to certain kinds: `replicaCount`/`autoscaling` and `strategy` are
  # Deployment-only (`autoscaling` also works on a StatefulSet), `volumeClaims`/`extraVolumeClaims`
  # are StatefulSet-only, and `updateStrategy` covers StatefulSet and DaemonSet.
  # @section -- Backend
  deploymentType: "Deployment"
  # -- The number of application controller pods to run. Ignored when `deploymentType` is
  # "DaemonSet" (one pod per node) or when `autoscaling.enabled` is true.
  # @section -- Backend
  replicaCount: 1
  image:
    # -- Registry to use for the app.
    # @section -- Backend
    registry: "ghcr.io"
    # -- Repository to use for the app.
    # @section -- Backend
    repository: "ia-generative/muffin/backend"
    # -- Image pull policy for the app.
    # @section -- Backend
    pullPolicy: "IfNotPresent"
    # -- Tag to use for the app.
    # @section -- Backend
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    # -- Image digest (`sha256:...`). When set it takes precedence over `tag`, pinning the exact
    # image content so the same release can never resolve to a different build - preferred over a
    # mutable tag for anything you deploy to production.
    # @section -- Backend
    digest: ""
  ingress:
    # -- Whether or not ingress should be enabled.
    # @section -- Backend
    enabled: false
    # -- Defines which ingress controller will implement the resource.
    # @section -- Backend
    className: ""
    # -- Additional ingress annotations.
    # @section -- Backend
    annotations: {}
    # -- Additional ingress labels.
    # @section -- Backend
    labels: {}
    hosts:
      -  # -- Name of the host record.
        # @section -- Backend
        name: "domain.local"
        # -- Paths of the host record to manage routing (avoids repeating the same host for
        # multiple paths/backends).
        # @section -- Backend
        paths:
          -  # -- Path of the host record to manage routing.
            # @section -- Backend
            path: "/"
            # -- Path type of the host record.
            # @section -- Backend
            pathType: "Prefix"
            backend:
              # -- Name of the backend service linked to the path (leave empty to use the app service).
              # @section -- Backend
              serviceName: ""
              # -- Port used by the backend service linked to the path (leave null to use the app service port).
              # @section -- Backend
              portNumber: null
    # -- Enable TLS configuration.
    # @section -- Backend
    tls: []
    # - secretName: domain.local-tls
    #   hosts:
    #   - domain.local
  ## Gateway API HTTPRoute configuration (alternative to Ingress)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/httproute/
  httpRoute:
    # -- Enable an HTTPRoute resource for this service.
    # @section -- Backend
    enabled: false
    # -- Additional HTTPRoute annotations.
    # @section -- Backend
    annotations: {}
    # -- Additional HTTPRoute labels.
    # @section -- Backend
    labels: {}
    # -- Parent references (Gateways) to attach the HTTPRoute to.
    # @section -- Backend
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace  # optional
    #   sectionName: https            # optional, specific listener name
    # -- Hostnames for the HTTPRoute to match.
    # @section -- Backend
    hostnames: []
    # - "example.com"
    # - "api.example.com"
    # -- Routing rules for the HTTPRoute.
    # @section -- Backend
    rules: []
    # - matches:
    #   - path:
    #       type: PathPrefix     # PathPrefix, Exact, or RegularExpression
    #       value: "/"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #     method: GET
    #   filters:
    #   - type: RequestHeaderModifier
    #     requestHeaderModifier:
    #       add:
    #       - name: "x-custom-header"
    #         value: "my-value"
    #   backendRefs:
    #   - name: my-service       # defaults to chart service if not set
    #     port: 80               # defaults to service port if not set
    #     weight: 100            # for traffic splitting
  ## Gateway API GRPCRoute configuration (for gRPC services)
  ## Ref: https://gateway-api.sigs.k8s.io/api-types/grpcroute/
  grpcRoute:
    # -- Enable a GRPCRoute resource for this service.
    # @section -- Backend
    enabled: false
    # -- Additional GRPCRoute annotations.
    # @section -- Backend
    annotations: {}
    # -- Additional GRPCRoute labels.
    # @section -- Backend
    labels: {}
    # -- Parent references (Gateways) to attach the GRPCRoute to.
    # @section -- Backend
    parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-namespace
    #   sectionName: grpc
    # -- Hostnames for the GRPCRoute to match.
    # @section -- Backend
    hostnames: []
    # - "grpc.example.com"
    # -- Routing rules for the GRPCRoute.
    # @section -- Backend
    rules: []
    # - matches:
    #   - method:
    #       type: Exact          # Exact or RegularExpression
    #       service: "mypackage.MyService"
    #       method: "MyMethod"
    #     headers:
    #     - type: Exact
    #       name: "x-version"
    #       value: "v1"
    #   backendRefs:
    #   - name: my-grpc-service
    #     port: 50051
    #     weight: 100
  # -- Mount the ServiceAccount token into the app pods. Defaults to false so a compromised
  # container holds no API credentials; the API server does not need the token unless the app
  # actually talks to the Kubernetes API. Applied at pod level so it holds even when
  # `serviceAccount.name` points at an SA that automounts.
  # @section -- Backend
  automountServiceAccountToken: false
  # -- Inject the legacy `{SVC}_SERVICE_HOST`/`_PORT` environment variables for every Service in the
  # namespace. Defaults to false: the variables are rarely used, leak the namespace's topology into
  # every container, and can collide with the app's own configuration. Set to true only for an app
  # that genuinely reads them.
  # @section -- Backend
  enableServiceLinks: false
  # -- Annotations for the app deployed pods.
  # @section -- Backend
  podAnnotations: {}
  # -- Labels for the app deployed pods.
  # @section -- Backend
  podLabels: {}
  # -- Pod-level security context. Defaults to a hardened baseline that satisfies the `restricted`
  # Pod Security Standard. Rendered via `toYaml`, so any `PodSecurityContext` field is accepted.
  # Adjust the UID/GID to whatever your image actually ships with - `runAsNonRoot` makes the
  # kubelet refuse to start a container that would run as root, which is the intended failure mode
  # rather than something to switch off. Set to `null` to omit the block entirely.
  # @section -- Backend
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    # Owns mounted volumes so a non-root container can still write to them.
    fsGroup: 1000
    # Only chown volume contents when the top-level dir doesn't already match, which avoids
    # re-chowning large volumes on every start.
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: "RuntimeDefault"
  # -- Init containers to add to the app pod.
  # @section -- Backend
  initContainers: []
  # - name: wait-for-keycloak
  #   image: docker.io/curlimages/curl:latest
  #   command:
  #   - "/bin/sh"
  #   - "-c"
  #   args:
  #   - "while [ $(curl -sw '%{http_code}' http://webapp.svc.cluster.local -o /dev/null) -ne 200 ]; do sleep 5; echo 'Waiting for the webapp...'; done"
  #   volumeMounts:
  #   - mountPath: /custom-volume
  #     name: custom-volume
  # -- Extra containers to add to the app pod as sidecars.
  # @section -- Backend
  extraContainers: []
  # - name: fluentd
  #   image: "fluentd"
  #   volumeMounts:
  #     - mountPath: /my-volume/config
  #       name: config
  # -- Backend container port number. Set to `null`/`0` (and disable `service`/probes) for
  # components that don't listen on any port (e.g. a queue consumer).
  # @section -- Backend
  containerPort: &backendContainerPort 8080
  # -- Backend container port name.
  # @section -- Backend
  containerPortName: "http"
  # -- Backend extra container ports.
  # @section -- Backend
  extraPorts: []
  # - containerPort: 9090
  #   protocol: "TCP"
  # -- Backend container command.
  # @section -- Backend
  command: []
  # -- Backend container command args.
  # @section -- Backend
  args: []
  # -- Container-level security context. Defaults to a hardened baseline that satisfies the
  # `restricted` Pod Security Standard: no privilege escalation, no capabilities, immutable root
  # filesystem. Rendered via `toYaml`, so any `SecurityContext` field is accepted. Note
  # `readOnlyRootFilesystem` requires the app to write only to mounted volumes - the default
  # `volumes`/`volumeMounts` below provide an `emptyDir` on /tmp for that reason. Set to `null` to
  # omit the block entirely.
  # @section -- Backend
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - "ALL"
  # -- Backend container env variables loaded from configmap or secret reference. List or map
  # (merged with `global.envFrom` above, global entries first); see `global.envFrom` for both forms.
  # @section -- Backend
  envFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret
  # -- Map or array of environment variables to inject into the app container (`valueFrom` supported).
  # @section -- Backend
  env: {}
  # A: "A"
  # B:
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # C:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  #
  # - name: "A"
  #   value: "A"
  # - name: "B"
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # - name: "C"
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  # -- Map of environment variables to inject into a configmap loaded by the app container (`valueFrom` not supported).
  # @section -- Backend
  envCm: {}
  # D: "D"
  # -- Map of environment variables to inject into a secret loaded by the app container (`valueFrom`
  # not supported). Values placed here are stored in plain text in the values file AND in the Helm
  # release secret, so use it for non-sensitive-but-secret-shaped config only. For real credentials
  # prefer referencing a Secret you manage elsewhere via `envFrom`, or have an operator materialise
  # it (see the `VaultStaticSecret` example under `extraObjects`).
  # @section -- Backend
  envSecret: {}
  # E: "E"
  ## Each probe is rendered verbatim via `toYaml`, so any `Probe` field (`exec`, `tcpSocket`,
  ## `grpc`...) is accepted, not just the `httpGet` shown here. To DISABLE a probe, set it to
  ## `null` - `{}` does not work, because Helm deep-merges values files and would merge these
  ## defaults straight back in.
  probes:
    startupProbe:
      httpGet:
        # -- Backend container healthcheck endpoint (startupProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Backend
        path: "/api/health"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Backend
        port: *backendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Backend
      initialDelaySeconds: 0
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Backend
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Backend
      failureThreshold: 10
      # -- How often (in seconds) to perform the probe.
      # @section -- Backend
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Backend
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        # -- Backend container healthcheck endpoint (readinessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Backend
        path: "/api/health"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Backend
        port: *backendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Backend
      initialDelaySeconds: 10
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Backend
      successThreshold: 2
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Backend
      failureThreshold: 2
      # -- How often (in seconds) to perform the probe.
      # @section -- Backend
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Backend
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        # -- Backend container healthcheck endpoint (livenessProbe is defined using `toYaml` so it is possible to override it completely).
        # @section -- Backend
        path: "/api/health"
        # -- Port to use for healthcheck (defaults to container port).
        # @section -- Backend
        port: *backendContainerPort
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Backend
      initialDelaySeconds: 30
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Backend
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Backend
      failureThreshold: 3
      # -- How often (in seconds) to perform the probe.
      # @section -- Backend
      periodSeconds: 30
      # -- Number of seconds after which the probe times out.
      # @section -- Backend
      timeoutSeconds: 5
  ## Deployment-only. StatefulSet and DaemonSet use `updateStrategy` below - their update
  ## strategies are a different API shape (no `Recreate`, and different `rollingUpdate` fields),
  ## so they are kept as separate values rather than one block that means three different things.
  strategy:
    # -- Strategy type used to replace old Pods by new ones, can be `Recreate` or `RollingUpdate`.
    # Only applied when `deploymentType` is "Deployment".
    # @section -- Backend
    type: "RollingUpdate"
    rollingUpdate:
      # -- The maximum number of pods that can be unavailable during the update process.
      # @section -- Backend
      maxUnavailable: 1
      # -- The maximum number of pods that can be scheduled above the desired number of pods.
      # @section -- Backend
      maxSurge: 1
  # -- Update strategy applied when `deploymentType` is "StatefulSet" or "DaemonSet" (ignored for
  # a Deployment, which uses `strategy` above). Rendered verbatim via `toYaml`, so it takes the
  # native `StatefulSetUpdateStrategy`/`DaemonSetUpdateStrategy` shape of the selected kind; left
  # empty, Kubernetes applies its own default (`RollingUpdate` for both).
  # @section -- Backend
  updateStrategy: {}
  # StatefulSet:
  #   type: "RollingUpdate"        # RollingUpdate or OnDelete
  #   rollingUpdate:
  #     partition: 0
  #     maxUnavailable: 1
  # DaemonSet:
  #   type: "RollingUpdate"        # RollingUpdate or OnDelete
  #   rollingUpdate:
  #     maxUnavailable: 1
  #     maxSurge: 0
  # -- Image credentials configuration.
  # @section -- Backend
  imagePullSecrets: []
  # - name: "pullsecret-name-1"
  #   create: false
  # - name: "pullsecret-name-2"
  #   create: true
  #   registry: ""
  #   username: ""
  #   password: ""
  #   email: ""
  ## Node-level pod settings. Mostly relevant when `deploymentType` is "DaemonSet" (node agents,
  ## log/metric collectors), but valid for every kind.
  # -- Share the host network namespace. Container ports then bind directly on the node, so they
  # must not collide with anything else running there.
  # @section -- Backend
  hostNetwork: false
  # -- Share the host PID namespace (lets the container see and signal host processes).
  # @section -- Backend
  hostPID: false
  # -- Pod DNS policy. Left empty, it defaults to `ClusterFirstWithHostNet` when `hostNetwork` is
  # true (otherwise a hostNetwork pod silently stops resolving cluster DNS) and to the Kubernetes
  # default `ClusterFirst` when it isn't.
  # @section -- Backend
  # @default -- `""` (`ClusterFirstWithHostNet` when `hostNetwork` is true)
  dnsPolicy: ""
  # -- Pod DNS configuration, merged with `dnsPolicy` by the kubelet.
  # @section -- Backend
  dnsConfig: {}
  # nameservers:
  # - "1.1.1.1"
  # options:
  # - name: "ndots"
  #   value: "2"
  # searches:
  # - "my.dns.search.suffix"
  # -- PriorityClass to schedule the pods with (e.g. `system-node-critical` for a node agent that
  # must not be evicted under pressure).
  # @section -- Backend
  priorityClassName: ""
  # -- (int) Grace period, in seconds, given to the pod to shut down cleanly before it is killed.
  # @section -- Backend
  # @default -- `null` (Kubernetes default of 30)
  terminationGracePeriodSeconds: null
  # -- Topology spread constraints used to spread the pods across failure domains.
  # @section -- Backend
  topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: "topology.kubernetes.io/zone"
  #   whenUnsatisfiable: "ScheduleAnyway"
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: "helm-backend"
  # -- Host aliases that will be injected at pod-level into /etc/hosts.
  # @section -- Backend
  hostAliases: []
  # - ip: "127.0.0.1"
  #   hostnames:
  #   - "foo.local"
  #   - "bar.local"
  # - ip: "10.1.2.3"
  #   hostnames:
  #   - "foo.remote"
  #   - "bar.remote"
  # -- List of volumes to add. Prefer this for volumes the chart itself always needs (e.g.
  # security-hardening `emptyDir`s); use `extraVolumes` below for anything you add on top, so
  # overriding one doesn't require repeating the other. Defaults to a `/tmp` `emptyDir`, which is
  # what makes the default `securityContext.readOnlyRootFilesystem: true` usable - drop it only if
  # you also relax that. Helm replaces lists wholesale rather than merging them, so overriding this
  # key means restating the entries you want to keep.
  # @section -- Backend
  volumes:
    - name: "tmp"
      emptyDir: {}
  # - name: config-volume
  #   configMap:
  #     name: log-config
  #     items:
  #       - key: log_level
