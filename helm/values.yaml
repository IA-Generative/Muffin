  dnsPolicy: ""
  # -- Pod DNS configuration, merged with `dnsPolicy` by the kubelet.
  # @section -- Index_rebuild
  dnsConfig: {}
  # nameservers:
  # - "1.1.1.1"
  # options:
  # - name: "ndots"
