    maxReplicas: 3
    # -- Average CPU utilization percentage for the app.
    # @section -- Index_rebuild
    targetCPUUtilizationPercentage: 80
    # -- Average memory utilization percentage for the app.
    # @section -- Index_rebuild
    targetMemoryUtilizationPercentage: 80
  kedaAutoscaler:
    # -- Scale the app with KEDA on the length of the Redis lists (Celery queues) it reads, instead of the HPA (`autoscaling`, to leave disabled). Needs KEDA in the cluster: renders a ScaledObject and a TriggerAuthentication.
    # @section -- Index_rebuild
    enabled: false
    # -- Minimum number of replicas (0 lets the app rest when its queues are empty).
    # @section -- Index_rebuild
    minReplicaCount: 0
    # -- Maximum number of replicas.
    # @section -- Index_rebuild
    maxReplicaCount: 3
    # -- Seconds between two checks of the lists.
    # @section -- Index_rebuild
    pollingInterval: 30
    # -- Seconds without work before the last replica is stopped (KEDA's own default, 300, when null).
    # @section -- Index_rebuild
    cooldownPeriod: null
    # -- Messages waiting per replica before KEDA adds one.
    # @section -- Index_rebuild
    listLength: 5
    # -- Redis lists to watch, KEDA scaling on the busiest. A Celery queue is a list of the same name, and the messages of a lower priority are in a list of their own (`<queue>\x06\x16<priority>`).
    # @section -- Index_rebuild
    queues: []
    redis:
