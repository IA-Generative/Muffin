  #   - "-c"
  #   args:
  #   - "while [ $(curl -sw '%{http_code}' http://webapp.svc.cluster.local -o /dev/null) -ne 200 ]; do sleep 5; echo 'Waiting for the webapp...'; done"
  #   volumeMounts:
  #   - mountPath: /custom-volume
  #     name: custom-volume
  # -- Extra containers to add to the app pod as sidecars.
  # @section -- Index_rebuild
  extraContainers: []
  # - name: fluentd
  #   image: "fluentd"
  #   volumeMounts:
  #     - mountPath: /my-volume/config
  #       name: config
  # -- Index_rebuild container port number. Set to `null`/`0` (and disable `service`/probes) for
  # components that don't listen on any port (e.g. a queue consumer).
  # @section -- Index_rebuild
  containerPort: &index_rebuildContainerPort null
  # -- Index_rebuild container port name.
  # @section -- Index_rebuild
  containerPortName: "http"
  # -- Index_rebuild extra container ports.
  # @section -- Index_rebuild
  extraPorts: []
  # - containerPort: 9090
  #   protocol: "TCP"
  # -- Index_rebuild container command.
  # @section -- Index_rebuild
  command: []
  # -- Index_rebuild container command args.
  # @section -- Index_rebuild
  args: []
  # -- Container-level security context. Defaults to a hardened baseline that satisfies the
  # `restricted` Pod Security Standard: no privilege escalation, no capabilities, immutable root
  # filesystem. Rendered via `toYaml`, so any `SecurityContext` field is accepted. Note
  # `readOnlyRootFilesystem` requires the app to write only to mounted volumes - the default
  # `volumes`/`volumeMounts` below provide an `emptyDir` on /tmp for that reason. Set to `null` to
  # omit the block entirely.
  # @section -- Index_rebuild
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - "ALL"
  # -- Index_rebuild container env variables loaded from configmap or secret reference. List or map
  # (merged with `global.envFrom` above, global entries first); see `global.envFrom` for both forms.
  # @section -- Index_rebuild
  envFrom: []
  # - configMapRef:
  #     name: my-config
  # - secretRef:
  #     name: my-secret
  # -- Map or array of environment variables to inject into the app container (`valueFrom` supported).
  # @section -- Index_rebuild
  env: {}
  # A: "A"
  # B:
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # C:
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  #
  # - name: "A"
  #   value: "A"
  # - name: "B"
  #   valueFrom:
  #     configMapKeyRef:
  #       name: "my-config"
  #       key: "B"
  # - name: "C"
  #   valueFrom:
  #     secretKeyRef:
  #       name: "my-secret"
  #       key: "C"
  # -- Map of environment variables to inject into a configmap loaded by the app container (`valueFrom` not supported).
  # @section -- Index_rebuild
  envCm: {}
  # D: "D"
  # -- Map of environment variables to inject into a secret loaded by the app container (`valueFrom`
  # not supported). Values placed here are stored in plain text in the values file AND in the Helm
  # release secret, so use it for non-sensitive-but-secret-shaped config only. For real credentials
  # prefer referencing a Secret you manage elsewhere via `envFrom`, or have an operator materialise
  # it (see the `VaultStaticSecret` example under `extraObjects`).
  # @section -- Index_rebuild
  envSecret: {}
  # E: "E"
  ## Each probe is rendered verbatim via `toYaml`, so any `Probe` field (`exec`, `tcpSocket`,
  ## `grpc`...) is accepted, not just the `httpGet` shown here. To DISABLE a probe, set it to
  ## `null` - `{}` does not work, because Helm deep-merges values files and would merge these
  ## defaults straight back in.
  probes:
    startupProbe:
      # -- Index_rebuild container healthcheck (startupProbe is defined using `toYaml` so it is possible to override it completely).
      # Uses `celery inspect ping` since Celery workers don't expose an HTTP endpoint.
      # @section -- Index_rebuild
      exec:
        command:
          - celery
          - -A
          - app.celery_app
          - inspect
          - ping
          - -d
          - celery@$(HOSTNAME)
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Index_rebuild
      initialDelaySeconds: 0
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Index_rebuild
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Index_rebuild
      failureThreshold: 10
      # -- How often (in seconds) to perform the probe.
      # @section -- Index_rebuild
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Index_rebuild
      timeoutSeconds: 5
    readinessProbe:
      # -- Index_rebuild container healthcheck (readinessProbe is defined using `toYaml` so it is possible to override it completely).
      # Uses `celery inspect ping` since Celery workers don't expose an HTTP endpoint.
      # @section -- Index_rebuild
      exec:
        command:
          - celery
          - -A
          - app.celery_app
          - inspect
          - ping
          - -d
          - celery@$(HOSTNAME)
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Index_rebuild
      initialDelaySeconds: 10
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Index_rebuild
      successThreshold: 2
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Index_rebuild
      failureThreshold: 2
      # -- How often (in seconds) to perform the probe.
      # @section -- Index_rebuild
      periodSeconds: 10
      # -- Number of seconds after which the probe times out.
      # @section -- Index_rebuild
      timeoutSeconds: 5
    livenessProbe:
      # -- Index_rebuild container healthcheck (livenessProbe is defined using `toYaml` so it is possible to override it completely).
      # Uses `celery inspect ping` since Celery workers don't expose an HTTP endpoint.
      # @section -- Index_rebuild
      exec:
        command:
          - celery
          - -A
          - app.celery_app
          - inspect
          - ping
          - -d
          - celery@$(HOSTNAME)
      # -- Number of seconds after the container has started before probe is initiated.
      # @section -- Index_rebuild
      initialDelaySeconds: 30
      # -- Minimum consecutive successes for the probe to be considered successful after having failed.
      # @section -- Index_rebuild
      successThreshold: 1
      # -- Minimum consecutive failures for the probe to be considered failed after having succeeded.
      # @section -- Index_rebuild
      failureThreshold: 3
      # -- How often (in seconds) to perform the probe.
      # @section -- Index_rebuild
      periodSeconds: 30
      # -- Number of seconds after which the probe times out.
      # @section -- Index_rebuild
      timeoutSeconds: 5
  ## Deployment-only. StatefulSet and DaemonSet use `updateStrategy` below - their update
  ## strategies are a different API shape (no `Recreate`, and different `rollingUpdate` fields),
  ## so they are kept as separate values rather than one block that means three different things.
  strategy:
    # -- Strategy type used to replace old Pods by new ones, can be `Recreate` or `RollingUpdate`.
    # Only applied when `deploymentType` is "Deployment".
    # @section -- Index_rebuild
    type: "RollingUpdate"
    rollingUpdate:
      # -- The maximum number of pods that can be unavailable during the update process.
      # @section -- Index_rebuild
      maxUnavailable: 1
      # -- The maximum number of pods that can be scheduled above the desired number of pods.
      # @section -- Index_rebuild
      maxSurge: 1
  # -- Update strategy applied when `deploymentType` is "StatefulSet" or "DaemonSet" (ignored for
  # a Deployment, which uses `strategy` above). Rendered verbatim via `toYaml`, so it takes the
  # native `StatefulSetUpdateStrategy`/`DaemonSetUpdateStrategy` shape of the selected kind; left
  # empty, Kubernetes applies its own default (`RollingUpdate` for both).
  # @section -- Index_rebuild
  updateStrategy: {}
  # StatefulSet:
  #   type: "RollingUpdate"        # RollingUpdate or OnDelete
  #   rollingUpdate:
  #     partition: 0
  #     maxUnavailable: 1
  # DaemonSet:
  #   type: "RollingUpdate"        # RollingUpdate or OnDelete
  #   rollingUpdate:
  #     maxUnavailable: 1
  #     maxSurge: 0
  # -- Image credentials configuration.
