  # @section -- Document_enrichment
  containerPort: &document_enrichmentContainerPort null
  # -- Document_enrichment container port name.
  # @section -- Document_enrichment
  containerPortName: "http"
  # -- Document_enrichment extra container ports.
  # @section -- Document_enrichment
  extraPorts: []
