      #   - appprojects
      #   verbs:
      #   - create
      #   - get
      #   - list
      #   - watch
      #   - update
      #   - delete
      #   - patch
    clusterRole:
      # -- Should the clusterRole be created.
      # @section -- Ocr_layout
      create: false
      # -- ClusterRole rules associated with the service account.
      # @section -- Ocr_layout
      rules: []
      # - apiGroups:
