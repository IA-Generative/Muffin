fullnameOverride: muffin

global:
  # Project name: Harbor project of the images (<project>/muffin-<service>) and Vault KV mount.
  project: exploration
  vault:
    # Environment prefix: secrets live at <project>/<env>/muffin/<name>
    env: dev
  # One Ingress for the whole application: `/api` goes to the backend, everything else to the frontend.
  # The real host (and `tls`) belong to the environment file; `whitelist` (a list of CIDRs, from the
  # shared `ipwhitelist.yaml`) restricts the source addresses, any address when it is empty.
  ingress:
    enabled: true
    annotations:
      monitor: enabled
      nginx.ingress.kubernetes.io/whitelist-source-range: '{{ .Values.whitelist | join "," | default "0.0.0.0/0" }}'
      # No size limit on a request body (nginx-ingress defaults to 1 MB, which refused any ZIP import
      # past that with a 413): Muffin bounds what an archive expands to itself, worker-side. Streamed
      # to the backend rather than buffered whole by the proxy, with time for a large upload.
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      k8s.apisix.apache.org/allowlist-source-range: '{{ .Values.whitelist | join "," | default "0.0.0.0/0" }}'
    hosts:
    - name: "muffin.example.org"
      paths:
      - path: "/api"
        pathType: "Prefix"
        backend:
          serviceName: "muffin-backend"
          portNumber: 8000
      - path: "/"
        pathType: "Prefix"
        backend:
          serviceName: "muffin-frontend"
          portNumber: 8080
  imagePullSecrets:
  - name: "registry-pull-secret"

backend:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/muffin-backend"
    pullPolicy: "Always"
  replicaCount: 2
  # FastAPI/uvicorn listens on 8000, not the chart default 8080. Without this override the
  # probes hit 8080 (connection refused) and the Service targetPort is wrong too.
  containerPort: 8000
  # The chart defines probes with `port: *backendContainerPort` (a YAML anchor resolved to 8080
  # at parse time). Overriding containerPort above does NOT change the anchor, so the probes
  # still hit 8080. We must re-declare the probes with the correct port. Paths and timings are
  # copied verbatim from the chart defaults (values.yaml).
  probes:
    # All probes use /api/health (checks redis, qdrant, db).
    startupProbe:
      httpGet:
        path: "/api/health"
        port: 8000
      initialDelaySeconds: 0
      successThreshold: 1
      failureThreshold: 10
      periodSeconds: 10
      timeoutSeconds: 5
    # readinessProbe/livenessProbe use /api/health - traffic is only routed to the backend
    # once all dependencies are healthy, and the pod is restarted if it becomes unhealthy.
    readinessProbe:
      httpGet:
        path: "/api/health"
        port: 8000
      initialDelaySeconds: 10
      successThreshold: 2
      failureThreshold: 2
      periodSeconds: 10
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: "/api/health"
        port: 8000
      initialDelaySeconds: 30
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 30
      timeoutSeconds: 5
  service:
    port: 8000
  serviceAccount:
    enabled: true
    create: true
  envFrom:
  - secretRef:
      name: "muffin-s3"
  - secretRef:
      name: "muffin-keycloak"
  - secretRef:
      name: "muffin-openai"
  - secretRef:
      name: "muffin-worker"
  - secretRef:
      name: "muffin-redis"
  - secretRef:
      name: "muffin-qdrant"
  # Listed last: envFrom's later-source-wins rule guarantees this computed DATABASE_URL is what
  # actually lands in the container even if another secret above ever grows a stray field of the
  # same name.
  - secretRef:
      name: "muffin-db-infos"
  # Plain (non-secret) app config - see backend/app/config/*.py for the full settings contract.
  env:
    KEYCLOAK_REALM: "mirai"
    KEYCLOAK_CLIENT_ID: "muffin"
    SESSION_COOKIE_SECURE: "true"
    # Internal ClusterIP service (sub-chart `qdrant`), not secret.
    QDRANT_URL: "http://muffin-qdrant:6333"
    # Same S3 endpoint already used for cnpg backups below - no need to self-host rustfs when a
    # known S3 exists. Only the access/secret key are Vault-backed (`muffin-s3`); bucket differs
    # per env (see values-<env>.yaml).
    AWS_ENDPOINT_URL: "https://s3.fr-par.scw.cloud"
    # Same OpenAI-compatible LLM hub used by ocr's worker.
    # OPENAI_API_BASE_URL: ""
    LOG_LEVEL: "INFO"

# worker/document_process runs as three pods from the same image (#291), one per kind of work - see
# app/celery_app.py there for which task goes where.
#
# Celery worker - document extraction: OCR, parsing, fetching a URL (CPU-bound, prefork). Runs the
# image's default command (its Dockerfile): queues document_extraction and document_processing (the
# one before #291, drained for one release), and the beat of the URL refresh scan.
document_process:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/muffin-worker-document-process"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  # KEDA ScaledObject on the Celery Redis queue replaces the chart-native HPA - the muffin
  # chart has no KEDA support, so ScaledObjects + TriggerAuthentications are declared in
  # `extraObjects` below. Scales on actual queue length instead of CPU.
  #
  # Probes disabled: the chart default uses `celery inspect ping` exec probes, but these
  # can cause false-positive restarts under load (the inspect call itself can timeout when
  # the worker is busy processing a long task). KEDA on queue length is the real liveness
  # signal here - if the queue drains, the worker is healthy by definition.
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "muffin-s3"
  - secretRef:
      name: "muffin-worker"
  - secretRef:
      name: "muffin-redis"
  env:
    BACKEND_API_URL: "http://muffin-backend:8000"
    AWS_ENDPOINT_URL: "https://s3.fr-par.scw.cloud"
    OCR_LANGUAGE: "fra"

# Celery worker - document enrichment: chunking with its embeddings, summary, QA, entities, tags.
# Mostly waiting for the embeddings/LLM API, so a pool of threads runs many at once; no beat.
document_enrichment:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/muffin-worker-document-process"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  # Probes disabled - see document_process above for rationale.
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  args:
  - "celery"
  - "-A"
  - "app.celery_app"
  - "worker"
  - "--loglevel=info"
  - "-Q"
  - "document_enrichment"
  - "-P"
  - "threads"
  - "-c"
  - "16"
  envFrom:
  - secretRef:
      name: "muffin-s3"
  - secretRef:
      name: "muffin-worker"
  - secretRef:
      name: "muffin-redis"
  env:
    BACKEND_API_URL: "http://muffin-backend:8000"
    AWS_ENDPOINT_URL: "https://s3.fr-par.scw.cloud"

# Celery worker - long I/O jobs: the blue/green index rebuilds (#12) and the ZIP imports (#223), so
# that neither holds up the ingestion of new documents. Prefork, a couple at a time; no beat.
index_rebuild:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/muffin-worker-document-process"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  # Probes disabled - see document_process above for rationale.
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  args:
  - "celery"
  - "-A"
  - "app.celery_app"
  - "worker"
  - "--loglevel=info"
  - "-Q"
  - "index_rebuild,document_import"
  - "-c"
  - "2"
  envFrom:
  - secretRef:
      name: "muffin-s3"
  - secretRef:
      name: "muffin-worker"
  - secretRef:
      name: "muffin-redis"
  env:
    BACKEND_API_URL: "http://muffin-backend:8000"
    AWS_ENDPOINT_URL: "https://s3.fr-par.scw.cloud"

# Celery worker - agentic research/chat execution (worker/agent_execution).
# NOTE: this worker's LangGraph checkpointer needs RediSearch (redis-stack), which is why
# `redis.image` below is overridden away from the chart's plain redis default - see comment there.
agent_execution:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/muffin-worker-agent-execution"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  # KEDA ScaledObject on the Celery Redis queue - see document_process above.
  # Probes disabled - see document_process above for rationale.
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "muffin-s3"
  - secretRef:
      name: "muffin-worker"
  - secretRef:
      name: "muffin-redis"
  env:
    CELERY_QUEUE_NAME: "agent_execution"
    BACKEND_API_URL: "http://muffin-backend:8000"
    AWS_ENDPOINT_URL: "https://s3.fr-par.scw.cloud"
    # Internal ClusterIP service (sub-chart `searxng`). Web search is opt-in per run (off by
    # default - see worker/agent_execution/app/config.py SEARXNG_URL).
    # Named `muffin-searxng` (not `searxng`) to avoid ArgoCD conflict: open-webui also deploys
    # a `searxng` Deployment, and ArgoCD tracks resources by name across apps.
    SEARXNG_URL: "http://muffin-searxng:8080"

# Celery worker - evaluation pipeline (worker/evaluation).
worker_evaluation:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/muffin-worker-evaluation"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  # KEDA ScaledObject on the Celery Redis queue - see document_process above.
  # Probes disabled - see document_process above for rationale.
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "muffin-worker"
  - secretRef:
      name: "muffin-redis"
  env:
    CELERY_QUEUE_NAME: "evaluation"
    BACKEND_API_URL: "http://muffin-backend:8000"

# Celery worker - living document editing (worker/document_edit). Reads the source file and writes
# the draft in the same S3 as the documents, hence `muffin-s3`.
worker_document_edit:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/muffin-worker-document-edit"
    pullPolicy: "Always"
  serviceAccount:
    enabled: true
    create: true
  # KEDA ScaledObject on the Celery Redis queue - see document_process above.
  # Probes disabled - see document_process above for rationale.
  probes:
    startupProbe: null
    readinessProbe: null
    livenessProbe: null
  envFrom:
  - secretRef:
      name: "muffin-s3"
  - secretRef:
      name: "muffin-worker"
  - secretRef:
      name: "muffin-redis"
  env:
    CELERY_QUEUE_NAME: "document_edit"
    BACKEND_API_URL: "http://muffin-backend:8000"
    AWS_ENDPOINT_URL: "https://s3.fr-par.scw.cloud"

cronjobs:
  # Backup of Qdrant (the only place the vectors are, besides what is rebuilt from PostgreSQL): a snapshot of
  # the whole storage every night, the last 7 kept on the snapshots volume of the qdrant pod. To restore one,
  # see docs/qdrant-backup.md.
  qdrant-snapshot:
    schedule: "30 1 * * *"
    concurrencyPolicy: "Forbid"
    image:
      registry: "harbor.sdid.cpin.numerique-interieur.com"
      repository: "{{ .Values.global.project }}/muffin-backend"
      pullPolicy: "IfNotPresent"
    command: ["python", "-c"]
    args:
    - |-
      import json, os, urllib.request

      url, keep = os.environ["QDRANT_URL"], 7
      headers = {"api-key": os.environ["QDRANT_API_KEY"]}

      def call(method, path):
          request = urllib.request.Request(url + path, method=method, headers=headers)
          with urllib.request.urlopen(request, timeout=3600) as response:
              return json.load(response)["result"]

      print("created", call("POST", "/snapshots?wait=true")["name"])
      names = sorted(snapshot["name"] for snapshot in call("GET", "/snapshots"))
      for name in names[:-keep]:
          call("DELETE", f"/snapshots/{name}?wait=true")
          print("deleted", name)
    envFrom:
    - secretRef:
        name: "muffin-qdrant"
    env:
      QDRANT_URL: "http://muffin-qdrant:6333"
    # Required by the namespace quota, like on every other pod.
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    serviceAccount:
      enabled: true
      create: true
    backoffLimit: 1
    restartPolicy: "Never"

jobs:
  migration:
    # `pre-install` would run before the CNPG cluster exists, so the wait-for-postgres init
    # container below could never succeed on a fresh install (deadlock until the Helm timeout).
    # On install the migration therefore runs after the resources are created (`post-install`);
    # on upgrade the cluster already exists, so it still runs first (`pre-upgrade`) and the new
    # code never starts on an old schema.
    hook:
      enabled: true
      types:
      - "post-install"
      - "post-upgrade"
      weight: 0
      deletePolicy: "before-hook-creation,hook-succeeded"
    image:
      registry: "harbor.sdid.cpin.numerique-interieur.com"
      repository: "{{ .Values.global.project }}/muffin-backend"
      # The tag defaults to the chart's appVersion (a fixed release), so the image does not need
      # to be pulled again on every run.
      pullPolicy: "IfNotPresent"
    command: ["alembic"]
    args: ["upgrade", "head"]
    envFrom:
    - secretRef:
        name: "muffin-db-infos"
    serviceAccount:
      enabled: true
      create: true
    # A failed migration is retried at most twice, and a stuck one is stopped after 15 minutes
    # instead of blocking the release until the Helm timeout.
    backoffLimit: 2
    activeDeadlineSeconds: 900
    initContainers:
    - name: wait-for-postgres
      # Same image as the migration itself (Harbor, already pulled): no dependency on docker.io,
      # which is unreachable from restricted environments and left the pod stuck in
      # `PodInitializing`. Polls the TCP port every second; alembic then fails fast if
      # PostgreSQL is not really ready.
      image: "harbor.sdid.cpin.numerique-interieur.com/{{ .Values.global.project }}/muffin-backend:{{ .Chart.AppVersion }}"
      imagePullPolicy: "IfNotPresent"
      command:
      - "python"
      - "-c"
      - |-
        import os,socket,time
        from urllib.parse import urlsplit
        u = urlsplit(os.environ['DATABASE_URL'])
        print(f'Waiting for PostgreSQL at {u.hostname}:{u.port or 5432}', flush=True)
        while True:
            try:
                socket.create_connection((u.hostname, u.port or 5432), 2).close()
                break
            except OSError:
                time.sleep(1)
        print('PostgreSQL reachable', flush=True)
      # Same secret as the migration: waits on the host alembic will really use (and logs it - no credentials).
      envFrom:
      - secretRef:
          name: "muffin-db-infos"
      securityContext:
        runAsUser: 10001
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        seccompProfile:
          type: "RuntimeDefault"
      resources:
        limits:
          cpu: "100m"
          memory: "128Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
    resources:
      limits:
        cpu: "500m"
        memory: "256Mi"
      requests:
        cpu: "250m"
        memory: "128Mi"

frontend:
  image:
    registry: "harbor.sdid.cpin.numerique-interieur.com"
    repository: "{{ .Values.global.project }}/muffin-frontend"
    pullPolicy: "Always"
  replicaCount: 2
  service:
    port: 8080
  serviceAccount:
    enabled: true
    create: true
  # No VITE_* runtime override here: unlike ocr's frontend, muffin's frontend has no config.js
  # runtime-injection entrypoint - VITE_API_BASE_URL is baked in at `pnpm build` time (see
  # frontend/src/composables/*.ts). See muffin/VARIABLES.md for the follow-up needed before prod.

redis:
  # RediSearch is required by the agent_execution worker's Redis-backed LangGraph checkpointer
  # (see worker/agent_execution - a HITL pause must survive being resumed by a different Celery
  # prefork child). Swap the plain redis image for redis-stack-server, which is a superset.
  fullnameOverride: muffin-redis
  image:
    registry: "docker.io"
    repository: "redis/redis-stack-server"
    tag: "7.4.0-v6"
  architecture: standalone
  auth:
    existingSecret: "muffin-redis"
    existingSecretPasswordKey: "REDIS_PASSWORD"
  # The chart's generated redis.conf has no `dir` directive, so redis defaults to CWD (/).
  # With readOnlyRootFilesystem: true (chart default), RDB snapshots fail with
  # "MISCONF Redis is configured to save RDB snapshots, but it's currently unable to persist
  # to disk." Point `dir` at the persistent volume mount (/data) so dump.rdb lands on the PVC.
  config:
    content: |
      # Redis configuration
      bind * -::*
      dir /data
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# Qdrant - dense + sparse (BM25) vector search backend (backend/app/services/vector_store.py).
# QDRANT_API_KEY is Vault-backed (`muffin-qdrant`): the backend reads it from that secret through
# envFrom, and the server from the same key through the env var below. Not the chart's `apiKey`: it reads
# the secret when the chart is rendered, which on a first install is before it exists - the server
# would start with no key at all. An env var is resolved when the pod starts, and the pod does not start
# without the secret.
qdrant:
  enabled: true
  # The release name is NOT `muffin` (it's `mirai-<env>-muffin-<id>` on the DSO cluster), so
  # without this override the Service would be named `<release>-qdrant` and the backend's
  # QDRANT_URL (`http://muffin-qdrant:6333`) wouldn't resolve. Same pattern as redis and
  # searxng below.
  fullnameOverride: muffin-qdrant
  # A single instance (no replication) to start with: the data is backed up with snapshots, see
  # docs/qdrant-backup.md.
  replicaCount: 1
  env:
  - name: QDRANT__SERVICE__API_KEY
    valueFrom:
      secretKeyRef:
        name: muffin-qdrant
        key: QDRANT_API_KEY
  # The chart's `ensure-dir-ownership` init container chowns the volumes, but takes no resources, which
  # the namespace quota refuses a pod without. The pod's fsGroup already gives the volumes to the
  # container's group, so it is not needed.
  updateVolumeFsOwnership: false
  persistence:
    size: "10Gi"
  # Snapshots (the backup) are written to their own volume: one as big as the data would fill the
  # main one and crash the pod.
  snapshotPersistence:
    enabled: true
    size: "10Gi"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

# SearxNG - meta-search engine used opt-in by agent_execution's web-search tool
# (worker/agent_execution/app/searxng_client.py). Off by default per run.
# Uses the unknowniq/searxng chart (same as open-webui) which supports fullnameOverride.
# The embedded valkey subchart is disabled - SearXNG points to the existing muffin-redis
# (broker Celery + RediSearch) for its cache/bot-protection rate limiter instead.
# Named `muffin-searxng` (not `searxng`) to avoid ArgoCD conflict with open-webui's own
# searxng Deployment - ArgoCD tracks resources by name and would see both apps managing
# the same `searxng` Deployment.
searxng:
  enabled: true
  fullnameOverride: muffin-searxng
  # Disable the embedded valkey subchart - reuse the existing muffin-redis instead.
  valkey:
    enabled: false
  serviceAccount:
    create: false
    automount: false
  image:
    repository: harbor.sdid.cpin.numerique-interieur.com/dockerhub/searxng/searxng
  imagePullSecrets:
    - name: registry-pull-secret
  # uid 977 = searxng user in the image. fsGroupChangePolicy: Always fixes the root:root
  # permissions warning on /etc/searxng (init container copies settings.yml from a root:root
  # ConfigMap into an emptyDir - without Always, the files stay root:root and SearXNG can't
  # write to them).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 977
    runAsGroup: 977
    fsGroup: 977
    fsGroupChangePolicy: Always
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
  initContainerResources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  secret:
    create: false
    existingSecret: searxng-secret
    secretKey: SEARXNG_SECRET
  env:
    - name: SEARXNG_SECRET
      valueFrom:
        secretKeyRef:
          name: searxng-secret
          key: SEARXNG_SECRET
    - name: SEARXNG_VALKEY_URL
      valueFrom:
        secretKeyRef:
          name: searxng-secret
          key: SEARXNG_VALKEY_URL
  # No persistent volume for config - settings.yml is rendered from the chart's ConfigMap
  # into an emptyDir at init time.
  persistence:
    config:
      enabled: false
  extraConfig:
    general:
      open_metrics: enabled
    valkey:
      # Static fallback in settings.yml. The SEARXNG_VALKEY_URL env var (from the VSO, with
      # the password embedded) takes precedence at runtime.
      url: "valkey://muffin-redis:6379/0"
    server:
      limiter: true
    ui:
      default_locale: fr
    outgoing:
      enable_http2: true
      pool_connections: 100
      pool_maxsize: 20
      request_timeout: 15
      useragent_suffix: ""
    search:
      safe_search: 1
      formats:
        - html
        - json
      max_ban_time_on_fail: 600
      suspended_times:
        SearxEngineAccessDenied: 3600
        SearxEngineTooManyRequests: 3600
        SearxEngineCaptcha: 86400
        SearxEngineResponseError: 300

extraObjects:
  muffin-s3:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: muffin-s3
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/s3'
      type: kv-v2
      destination:
        name: muffin-s3
        create: true
  muffin-openai:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: muffin-openai
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/openai'
      type: kv-v2
      destination:
        name: muffin-openai
        create: true
  muffin-keycloak:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: muffin-keycloak
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/keycloak'
      type: kv-v2
      destination:
        name: muffin-keycloak
        create: true
  muffin-worker:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: muffin-worker
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/worker'
      type: kv-v2
      destination:
        name: muffin-worker
        create: true
  muffin-redis:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: muffin-redis
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/redis'
      type: kv-v2
      destination:
        name: muffin-redis
        create: true
        # Keeps the raw REDIS_PASSWORD (used by the redis chart's own `auth.existingSecret`
        # above) and adds a computed REDIS_URL for the app's envFrom - single Vault path serves
        # both. Assumes the Vault-stored password has no URL-reserved characters.
        transformation:
          templates:
            REDIS_URL:
              text: 'redis://:{{ "{{" }} get .Secrets "REDIS_PASSWORD" {{ "}}" }}@muffin-redis:6379/0'
  muffin-db-superuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: muffin-db-superuser
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/db-superuser'
      type: kv-v2
      destination:
        name: muffin-db-superuser
        create: true
        # CNPG requires a kubernetes.io/basic-auth secret (username + password keys)
        # for superuserSecret - an Opaque secret (VSO default) makes the Cluster
        # loop forever waiting for a usable secret.
        type: kubernetes.io/basic-auth
  muffin-db-appuser:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: muffin-db-appuser
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/db-appuser'
      type: kv-v2
      destination:
        name: muffin-db-appuser
        create: true
        # CNPG requires a kubernetes.io/basic-auth secret (username + password keys)
        # for initdb.secret - an Opaque secret (VSO default) makes the Cluster
        # loop forever waiting for a usable secret.
        type: kubernetes.io/basic-auth
  muffin-db-infos:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: muffin-db-infos
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/db-infos'
      type: kv-v2
      destination:
        name: muffin-db-infos
        create: true
        transformation:
          excludes:
          - ".*"
          templates:
            # Host must match `cnpg.fullnameOverride`-rw; port/dbname match `cnpg.cluster.initdb`
            # below. Driver is `postgresql+asyncpg` (backend/app/config/database.py), not plain
            # `postgresql` like ocr. Assumes the Vault-stored password has no URL-reserved
            # characters - if it does, this needs URL-encoding, which VSO templates don't provide.
            DATABASE_URL:
              text: 'postgresql+asyncpg://{{ "{{" }} get .Secrets "username" {{ "}}" }}:{{ "{{" }} get .Secrets "password" {{ "}}" }}@muffin-pg-cluster-rw:5432/muffin'
  muffin-db-backups:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: muffin-db-backups
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/db-backups'
      type: kv-v2
      destination:
        name: muffin-db-backups
        create: true
  muffin-qdrant:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: muffin-qdrant
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/qdrant'
      type: kv-v2
      destination:
        name: muffin-qdrant
        create: true
  searxng-secret:
    apiVersion: secrets.hashicorp.com/v1beta1
    kind: VaultStaticSecret
    metadata:
      name: searxng-secret
    spec:
      vaultAuthRef: vault-auth
      mount: '{{ .Values.global.project }}'
      path: '{{ .Values.global.vault.env }}/muffin/searxng'
      type: kv-v2
      destination:
        name: searxng-secret
        create: true
        # SEARXNG_SECRET: raw, consumed by the searxng chart via `secret.existingSecret`.
        # SEARXNG_VALKEY_PASSWORD: raw, must match the REDIS_PASSWORD of muffin-redis (SearXNG
        #   reuses the existing muffin-redis for its cache/bot-protection, no dedicated valkey).
        # SEARXNG_VALKEY_URL: computed from the password for the searxng container env.
        transformation:
          templates:
            SEARXNG_VALKEY_URL:
              text: 'valkey://:{{ "{{" }} get .Secrets "SEARXNG_VALKEY_PASSWORD" {{ "}}" }}@muffin-redis:6379/0'

  # --- KEDA ScaledObjects (Redis queue length autoscaling for Celery workers) ---
  # The muffin chart has no native KEDA support, so ScaledObjects + TriggerAuthentications are
  # declared here as extraObjects. Each worker has its own Celery queue (listName) and scales
  # independently based on the number of pending messages in its Redis list.
  # KEDA polls the Redis Service directly (not Sentinel-aware, same pattern as ocr). The
  # address MUST be a FQDN (`muffin-redis.<namespace>.svc.cluster.local`), not the short
  # name `muffin-redis`: KEDA runs in its own namespace (`keda-system`) and can't resolve
  # short names from muffin's namespace. Same pattern as ocr's chart, which builds the
  # address as `<fullname>-master.<Release.Namespace>:6379`.
  # The TriggerAuthentication references `muffin-redis` (same Vault-managed secret as the
  # app's envFrom) for the REDIS_PASSWORD - KEDA resolves the Secret by name across
  # namespaces only if the Secret is in the same namespace as the ScaledObject, which is
  # why the ScaledObjects are deployed in muffin's namespace (not keda-system).
  #
  # Per-env overrides (minReplicaCount, maxReplicaCount, pollingInterval, listLength) live
  # in `values-<env>.yaml` under `extraObjects.<name>.spec`.

  # NetworkPolicy: allows the KEDA operator (namespace `keda-system`) to reach the Redis pods on
  # port 6379. Without it, a default-deny namespace policy (common on DSO/managed platforms) drops
  # the KEDA scaler's TCP SYN and the ScaledObjects go degraded with:
  #   "connection to redis failed: dial tcp <redis-ip>:6379: i/o timeout"
  # The Redis pods carry the RELEASE name as `app.kubernetes.io/instance` (not the service name
  # `muffin-redis`), so the selector uses it.
  muffin-redis-keda-netpol:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: muffin-redis-allow-keda
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
          app.kubernetes.io/instance: "{{ .Release.Name }}"
      policyTypes:
      - Ingress
      ingress:
      - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda-system
        ports:
        - protocol: TCP
          port: 6379

  # TriggerAuthentication: shared by all the worker ScaledObjects.
  muffin-keda-triggerauth:
    apiVersion: keda.sh/v1alpha1
    kind: TriggerAuthentication
    metadata:
      name: muffin-keda-triggerauth
    spec:
      secretTargetRef:
      - parameter: "password"
        name: "muffin-redis"
        key: "REDIS_PASSWORD"

  # ScaledObject for document_process - the extraction pod (#291). One trigger per Redis list it
  # reads, KEDA scaling on the busiest: document_extraction, the low-priority list Celery keeps
  # next to it for a ZIP import's documents (`<queue>\x06\x16<priority>`, see BULK_PRIORITY in
  # backend/app/core/tasks.py), and document_processing, the queue before #291 (to remove with it).
  muffin-keda-document-process:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: muffin-document-process
    spec:
      scaleTargetRef:
        name: muffin-document-process
        kind: Deployment
        apiVersion: apps/v1
      minReplicaCount: 2
      maxReplicaCount: 4
      pollingInterval: 30
      triggers:
      - type: redis
        metricType: AverageValue
        metadata:
          address: "muffin-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "document_extraction"
          listLength: "5"
        authenticationRef:
          name: muffin-keda-triggerauth
      - type: redis
        metricType: AverageValue
        metadata:
          address: "muffin-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "document_extraction\x06\x169"
          listLength: "5"
        authenticationRef:
          name: muffin-keda-triggerauth
      - type: redis
        metricType: AverageValue
        metadata:
          address: "muffin-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "document_processing"
          listLength: "5"
        authenticationRef:
          name: muffin-keda-triggerauth

  # ScaledObject for document_enrichment (queue: document_enrichment) - each pod runs 16 tasks at
  # once (threads), hence a longer list per pod before scaling out.
  muffin-keda-document-enrichment:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: muffin-document-enrichment
    spec:
      scaleTargetRef:
        name: muffin-document-enrichment
        kind: Deployment
        apiVersion: apps/v1
      minReplicaCount: 2
      maxReplicaCount: 4
      pollingInterval: 30
      triggers:
      - type: redis
        metricType: AverageValue
        metadata:
          address: "muffin-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "document_enrichment"
          listLength: "32"
        authenticationRef:
          name: muffin-keda-triggerauth
      # The windows of a document (QA, entities) are sent with a lower priority (WINDOW_PRIORITY = 3 in
      # worker/document_process/app/tasks/_shared.py), so that a big document does not hold up the chunking
      # of the next ones: Redis keeps them in a list of their own, which has to be watched as well.
      - type: redis
        metricType: AverageValue
        metadata:
          address: "muffin-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "document_enrichment\x06\x163"
          listLength: "32"
        authenticationRef:
          name: muffin-keda-triggerauth

  # ScaledObject for index_rebuild (queues: index_rebuild, document_import). Never to zero: a
  # running rebuild or import has already left the list (acks_late), so KEDA would not see it and
  # could stop the pod under it.
  muffin-keda-index-rebuild:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: muffin-index-rebuild
    spec:
      scaleTargetRef:
        name: muffin-index-rebuild
        kind: Deployment
        apiVersion: apps/v1
      minReplicaCount: 1
      maxReplicaCount: 4
      pollingInterval: 30
      triggers:
      - type: redis
        metricType: AverageValue
        metadata:
          address: "muffin-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "index_rebuild"
          listLength: "2"
        authenticationRef:
          name: muffin-keda-triggerauth
      - type: redis
        metricType: AverageValue
        metadata:
          address: "muffin-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "document_import"
          listLength: "2"
        authenticationRef:
          name: muffin-keda-triggerauth

  # ScaledObject for agent_execution (queue: agent_execution)
  muffin-keda-agent-execution:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: muffin-agent-execution
    spec:
      scaleTargetRef:
        name: muffin-agent-execution
        kind: Deployment
        apiVersion: apps/v1
      minReplicaCount: 2
      maxReplicaCount: 4
      pollingInterval: 30
      triggers:
      - type: redis
        metricType: AverageValue
        metadata:
          address: "muffin-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "agent_execution"
          listLength: "5"
        authenticationRef:
          name: muffin-keda-triggerauth

  # ScaledObject for worker_evaluation (queue: evaluation)
  muffin-keda-worker-evaluation:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: muffin-worker-evaluation
    spec:
      scaleTargetRef:
        name: muffin-worker-evaluation
        kind: Deployment
        apiVersion: apps/v1
      minReplicaCount: 2
      maxReplicaCount: 4
      pollingInterval: 30
      triggers:
      - type: redis
        metricType: AverageValue
        metadata:
          address: "muffin-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "evaluation"
          listLength: "5"
        authenticationRef:
          name: muffin-keda-triggerauth

  # ScaledObject for worker_document_edit (queue: document_edit)
  muffin-keda-worker-document-edit:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: muffin-worker-document-edit
    spec:
      scaleTargetRef:
        name: muffin-worker-document-edit
        kind: Deployment
        apiVersion: apps/v1
      minReplicaCount: 1
      maxReplicaCount: 3
      pollingInterval: 30
      triggers:
      - type: redis
        metricType: AverageValue
        metadata:
          address: "muffin-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
          listName: "document_edit"
          listLength: "3"
        authenticationRef:
          name: muffin-keda-triggerauth

postgres:
  enabled: false

# A known external S3 (s3.fr-par.scw.cloud, same one used for cnpg backups) is used instead -
# no need to self-host object storage.
rustfs:
  enabled: false

cnpg:
  enabled: true
  fullnameOverride: "muffin-pg-cluster"
  mode: "standalone"
  cluster:
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.7"
    # The namespace quota (dso-quota) rejects any pod without requests/limits. CNPG applies these to
    # every pod of the cluster, including the `initdb` job and its `bootstrap-controller` init
    # container, so they are required for the cluster to bootstrap at all.
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    enableSuperuserAccess: true
    superuserSecret: "muffin-db-superuser"
    initdb:
      database: "muffin"
      owner: "muffin"
      secret:
        name: "muffin-db-appuser"
    monitoring:
      enabled: true
  backups:
    method: "barmanObjectStore"
    endpointURL: "https://s3.fr-par.scw.cloud"
    provider: "s3"
    data:
      compression: "gzip"
      encryption: ""
      jobs: 2
    wal:
      compression: "gzip"
      encryption: ""
      maxParallel: 2
    secret:
      create: false
      name: "muffin-db-backups"
  recovery:
    method: "object_store"
    clusterName: "muffin-pg-cluster"
    database: "muffin"
    owner: "muffin"
    endpointURL: "https://s3.fr-par.scw.cloud"
    provider: "s3"
    secret:
      create: false
      name: "muffin-db-backups"
  replica:
    bootstrap:
      source: "object_store"
      database: "muffin"
      owner: "muffin"
    origin:
      objectStore:
        clusterName: "muffin-pg-cluster"
        endpointURL: "https://s3.fr-par.scw.cloud"
        provider: "s3"
        secret:
          create: false
          name: "muffin-db-backups"
