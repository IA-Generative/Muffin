# A real Open WebUI next to Muffin, to test the OWUI -> Muffin synchronisation (#453) against the real thing.
# It shares Muffin's S3 (same bucket, own key prefix), Qdrant (classic mode, own prefix) and Keycloak, as in production.
#
#   docker compose -f docker-compose.yaml -f docker-compose.owui.yaml up -d rustfs qdrant keycloak owui
#
# Open WebUI is then on http://localhost:3001. See docs/owui-test-instance.md.
services:
  # Keycloak announces its public address (the browser's) for the sign-in page and the one of the compose network
  # for what Open WebUI asks the server (token, keys): the same issuer, reachable from both.
  keycloak:
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  owui-bucket:
    image: amazon/aws-cli:2.17.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket muffin-documents 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3 mb s3://muffin-documents

  tika:
    image: apache/tika:3.2.3.0-full
    ports:
      - "9998:9998"

  owui:
    image: ghcr.io/open-webui/open-webui:${OWUI_VERSION:-v0.12.5}
    depends_on:
      owui-bucket:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      tika:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      WEBUI_SECRET_KEY: dev-only-owui-secret-not-for-prod
      # dev exposes the API schema (/openapi.json, /docs), which the sync client is written against.
      ENV: dev
      WEBUI_AUTH: "true"
      # The environment always wins over what the admin UI saved, so the stack behaves the same on every start.
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_SIGNUP: "true"
      # The sync reads OWUI with an API key (#453).
      ENABLE_API_KEYS: "true"
      # Files in the same bucket as Muffin's, under their own prefix.
      # Sign in with the Keycloak of Muffin, as in production: the users then carry their Keycloak subject
      # (`oauth.oidc.sub`), which is what the synchronisation ties the members of a group to.
      WEBUI_URL: http://localhost:3001
      ENABLE_OAUTH_SIGNUP: "true"
      DEFAULT_USER_ROLE: user
      OAUTH_PROVIDER_NAME: Keycloak
      OAUTH_CLIENT_ID: open-webui
      OAUTH_CLIENT_SECRET: dev-only-secret-not-for-prod
      OPENID_PROVIDER_URL: http://keycloak:8080/realms/muffin/.well-known/openid-configuration
      OPENID_REDIRECT_URI: http://localhost:3001/oauth/oidc/callback
      OAUTH_SCOPES: openid email profile
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_BUCKET_NAME: muffin-documents
      # Its own prefix in the bucket it shares with Muffin (whose keys are under documents/).
      S3_KEY_PREFIX: open-webui
      S3_REGION_NAME: us-east-1
      S3_ADDRESSING_STYLE: path
      # Vectors in the same Qdrant, classic mode: one collection per knowledge base, prefixed.
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-only-qdrant-key-not-for-prod}
      QDRANT_COLLECTION_PREFIX: open-webui
      ENABLE_QDRANT_MULTITENANCY_MODE: "false"
      # Tika, as in production: one document per file, no page numbers.
      CONTENT_EXTRACTION_ENGINE: tika
      TIKA_SERVER_URL: http://tika:9998
      # Chat from the same hub too, to try Muffin's MCP tools (#467) from Open WebUI's own chat.
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Everyone who signs in may use the models of the hub, as the test of the tools (#467, #476) is done by a user.
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      # Embeddings from the same OpenAI-compatible hub as Muffin, so both read the same vector space.
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      RAG_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${OWUI_EMBEDDING_MODEL:-bge-multilingual-gemma2}
    volumes:
      - owui-data:/app/backend/data
    ports:
      - "3001:8080"
    restart: unless-stopped

  # The synchronisation Open WebUI -> Muffin (#453). OWUI_API_KEY is the key of an Open WebUI administrator
  # (docs/owui-test-instance.md).
  worker-owui-sync:
    build:
      context: ./worker/owui_sync
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_API_URL: http://backend:8000
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-only-worker-key-not-for-prod}
      OWUI_BASE_URL: http://owui:8080
      OWUI_API_KEY: ${OWUI_API_KEY:-}
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-only-qdrant-key-not-for-prod}
      OWUI_QDRANT_PREFIX: open-webui
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      owui:
        condition: service_started
    restart: unless-stopped

  # The beat that starts a synchronisation every OWUI_SYNC_INTERVAL_MINUTES: one process, not one per worker.
  worker-owui-sync-beat:
    build:
      context: ./worker/owui_sync
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info", "-s", "/tmp/celerybeat-schedule"]
    environment:
      REDIS_URL: redis://redis:6379/0
      OWUI_SYNC_INTERVAL_MINUTES: ${OWUI_SYNC_INTERVAL_MINUTES:-60}
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  owui-data:
